    '-পরিদর্শন: দুপুরে কাজ নিষেধের নিয়ম ভাঙায় <b>৩৮৮টি কাজের জায়গা বন্ধ করা হয়</b> (প্রতিটি ৩ দিনের জন্য)।',
    'মন্ত্রণালয় বলছে, পরিদর্শন ও সচেতনতা সারা বছর চলে। দেখুন <a href="#rights/heat">গ্রীষ্মের গরম থেকে সুরক্ষা</a>।'
  ]},
  {t:'গরমের প্রচারণা কী শেখায়', p:[
    '<b>হিট স্ট্রেসের লক্ষণ:</b> মাথা ঘোরা, মাথাব্যথা, খুব বেশি ঘাম (বা একদম ঘাম না হওয়া), ক্লান্তি, অজ্ঞান হয়ে যাওয়া।',
    '<b>কী করবেন:</b> কাজ থামান, ছায়ায় যান, পানি পান করুন, আর দরকার হলে চিকিৎসা নিন। জরুরি: <a href="tel:999">999</a>।',
    '<b>প্রতিরোধ:</b> বারবার পানি পান করুন, ছায়ায় বিশ্রাম নিন, বাইরে হালকা কাপড় ও মাথা ঢাকার জিনিস পরুন।'
  ]},
  {t:'আগের গরমের প্রচারণা', p:[
    '-<b>২০২৫:</b> স্বাস্থ্য মন্ত্রণালয় ও তহবিলের সাথে দেশজুড়ে প্রচারণা। ২১ জুন ২০২৫-এ এশিয়ান টাউনে শ্রমিকদের বিভিন্ন ভাষায় ছাপা তথ্যপত্র দেওয়া হয়।',
    '-<b>২০২৪:</b> বিশেষ পরিদর্শন; নিয়ম ভাঙায় ৩৬৮টি কাজের জায়গা বন্ধ করা হয়।',
    '-<b>২০২৪:</b> BWI (একটি আন্তর্জাতিক ইউনিয়ন) ও মন্ত্রণালয়ের যৌথ গরমের প্রচারণা ২৫টি কোম্পানি ও কমিউনিটির ২,৮২৪-এর বেশি শ্রমিকের কাছে পৌঁছায়।'
  ]},
  {t:'নিরাপত্তা পরিদর্শন ও সেমিনার', p:[
    'জানুয়ারি থেকে মার্চ ২০২৬-এ মন্ত্রণালয়ের নিরাপত্তা ও স্বাস্থ্য বিভাগ <b>৩৫৫টি সচেতনতা কর্মসূচি</b> চালায়, ৫,৯১৮টি কাজের জায়গা পরিদর্শন করে এবং শ্রমিকদের থাকার জায়গায় ২,৩২২ বার যায়।',
    'জানুয়ারি ২০২৬-এ কোম্পানি, স্বাস্থ্য মন্ত্রণালয় ও তহবিলের সাথে শ্রমিকদের জন্য নির্মাণ নিরাপত্তা নিয়ে সেমিনার হয়।'
  ]},
  {t:'নিজের অধিকার জানুন: বিভিন্ন ভাষায় গাইড', p:[
    '-গৃহকর্মীদের জন্য <b>“Know Your Rights”</b> (নিজের অধিকার জানুন) পুস্তিকা (ILO), ১২টি ভাষায়: আরবি, বাহাসা, বাংলা, ইংরেজি, হিন্দি, মালয়ালম, নেপালি, সিংহলি, সোয়াহিলি, তাগালগ, তেলুগু ও উর্দু।',
    '-NHRC গৃহকর্মীদের অধিকার ও দায়িত্ব নিয়ে ১১টি ভাষায় পুস্তিকা দেয় (জুন ২০২৫)।',
    '-NHRC-র ২০২৫ সালের শ্রমিক দিবস প্রচারণার নাম ছিল <b>“Legal aid: your voice is heard, your rights are protected”</b> (আইনি সহায়তা: আপনার কথা শোনা হয়, আপনার অধিকার সুরক্ষিত), শ্রম মন্ত্রণালয়, তহবিল, ILO ও IOM-এর সাথে।',
    '-মন্ত্রণালয় চাকরি বদলের প্ল্যাটফর্মের গাইড আরবি ও ইংরেজিতে প্রকাশ করেছে।'
  ]},
  {t:'নিজের দেশে Qatar Visa Centre (কাতার ভিসা সেন্টার)', p:[
    'যাওয়ার আগে নিজের দেশের কাতার ভিসা সেন্টারে আপনি <b>আসল চুক্তি পড়ে সই</b> করতে পারেন, আঙুলের ছাপ দেন ও মেডিকেল পরীক্ষা করান। সেখানে আপনার অধিকার ও কাতারের জীবন নিয়ে তথ্যও পান।',
    'এই সেবাগুলো <b>শ্রমিকদের জন্য বিনামূল্যে</b>। টাকা দেয় মালিক।',
    'চুক্তি যদি প্রতিশ্রুতির মতো না হয়, যাওয়ার আগে আবার ভেবে দেখতে পারেন।',
    'সেন্টার (জুলাই ২০২৪): ভারত (New Delhi, Mumbai, Kolkata, Lucknow, Hyderabad, Chennai, Kochi), পাকিস্তান (Islamabad, Karachi), বাংলাদেশ (Dhaka, Sylhet), নেপাল (Kathmandu), ফিলিপাইন (Manila), শ্রীলঙ্কা (Colombo)। কেনিয়া, ইন্দোনেশিয়া ও তিউনিসিয়ায় সেন্টার খোলার পরিকল্পনা ছিল।'

  help:{title:'अहिले सहयोग', intro:'तपाईंलाई उजुरी गर्ने अधिकार छ। यसरी गर्नुहोस्।', secs:[
    {t:'श्रम उजुरी कसरी गर्ने', steps:[
      ['कागजपत्र जम्मा गर्नुहोस्','सम्झौता, कतार ID, बैंकको कागज वा पे-स्लिप, फोटो, मेसेज, थाहा भएका साथी कामदारको नाम। फोनमा प्रति राख्नुहोस्।'],
      ['श्रम मन्त्रालयमा सम्पर्क गर्नुहोस्','फोन गर्नुहोस् <a href="tel:16008">16008</a> (24 घण्टा)। <a href="https://www.mol.gov.qa" target="_blank" rel="noopener">mol.gov.qa</a> मा अनलाइन उजुरी प्लेटफर्म पनि प्रयोग गर्न सक्नुहुन्छ, वा श्रम मन्त्रालयको कार्यालयमा जान सक्नुहुन्छ।'],
      ['मिलापको बैठक','मन्त्रालयले तपाईं र मालिकलाई बोलाएर कुरा गरी समस्या मिलाउने प्रयास गर्छ। प्रमाण ल्याउनुहोस्।'],
      ['Labour Dispute Settlement Committee (श्रम विवाद समाधान समिति)','मिलेन भने मुद्दा यो समितिमा जान सक्छ। यसको नेतृत्व न्यायाधीशले गर्छन्। कामदारले अदालत शुल्क तिर्नुपर्दैन। सुनुवाइ अरबीमा हुन्छ। पहिलो सुनुवाइदेखि 3 हप्ताभित्र समितिले निर्णय गर्नुपर्छ। दुवै पक्षले Court of Appeal (पुनरावेदन अदालत) मा पुनरावेदन गर्न सक्छन्।'],
      ['अझै पैसा पाउनुभएन?','समितिले पैसा दिन आदेश दिएपछि पनि मालिकले दिएन भने <a href="#help/wsif">Workers’ Support and Insurance Fund</a> मा निवेदन दिनुहोस्।']
    ], p:[
      '<b>समय सीमा:</b> काममा हुँदै, वा काम सकिएको <b>1 वर्षभित्र</b> उजुरी गर्नुहोस्।',
      '<b>निकालियो वा सजाय दियो?</b> 7 दिनभित्र मालिकलाई लिखित उजुरी दिनुहोस्। मालिकलाई जवाफ दिन 7 दिन हुन्छ। चित्त बुझेन भने अर्को 7 दिनभित्र मन्त्रालयमा जानुहोस्।',
      'मुद्दामा समय लाग्न सक्छ। पर्खिँदा आम्दानीका लागि केही कामदारले काम बदल्छन्।'
    ]},
    {t:'Workers’ Support and Insurance Fund (कामदार सहायता तथा बीमा कोष)', p:[
      'एउटा सरकारी कोष, जसले मालिकले पैसा नदिँदा कामदारको बाँकी रकम दिन सक्छ।',
      'यसले मुख्य रूपमा Labour Dispute Settlement Committee वा अदालतको <b>अन्तिम निर्णय</b> पछि पैसा दिन्छ। त्यो निर्णयको प्रति राखेर निवेदन दिनुहोस्।',
      'मासिक तलब ढिलो भएका केही अवस्थामा र अरू जरुरी अवस्थामा पनि कोषले निर्णय गरेमा पैसा दिन सक्छ।',
      'कोषले दिने रकमको सीमा हुन्छ। पछि कोषले मालिकबाट पैसा असुल्छ।'
    ]},
    {t:'National Human Rights Committee (NHRC, राष्ट्रिय मानव अधिकार समिति)', p:[
      'मानव अधिकारका लागि कतारको सरकारी निकाय। इमेल, फोन, फ्याक्स, आफैँ गएर वा अनलाइन उजुरी पठाउन सक्नुहुन्छ।',
      'उजुरी स्पष्ट लेख्नुहोस्। फोन नम्बर र ठेगाना, पासपोर्ट वा भिसाको प्रति, र प्रमाणका कागज राख्नुहोस्।'
    ]},
    {t:'सहयोग पाउने अरू ठाउँ', p:[
      '<a href="#mol">श्रम मन्त्रालय</a> – उजुरी, काम बदल्ने, गर्मीका नियम।',
      '<a href="#ilo">ILO कार्यालय</a> – तपाईंको समस्या मन्त्रालयसम्म पुर्‍याउन सक्छ।',
      '<a href="#embassies">तपाईंको दूतावास</a> – आफ्ना नागरिकलाई सल्लाह र सहयोग।',
      '<a href="#emergency">आपतकाल 999</a> – खतरा, हिंसा, दुर्घटना।',
      '<a href="#listen">तपाईंको आवाज</a> – सरकारले कामदारको कुरा कुन-कुन तरिकाले सुन्छ।'
    ]},
    {t:'सुरक्षित रहनुहोस्', p:[
      '-नबुझेको कागजमा सही नगर्नुहोस्।',
      '-नपाएको पैसा पाएँ भन्ने कागजमा कहिल्यै सही नगर्नुहोस्।',
      '-सम्झौता, ID, पे-स्लिप र बैंकका मेसेजको फोटो खिच्नुहोस्।',
      '-मन्त्रालयको सरकारी वेबसाइट <b>mol.gov.qa</b> र सरकारी सोसल मिडिया <b>@MOLQTR</b> मात्र विश्वास गर्नुहोस्। नक्कली अकाउन्ट पनि छन्।',
      '-पासवर्ड, पिन कोड वा बैंकको विवरण कसैलाई नदिनुहोस्।'
    ]}
  ]},

  salary:{title:'तलब ढिलो? के गर्ने', intro:'यी कदम चाल्नुहोस्। शान्त रहनुहोस् र प्रमाण राख्नुहोस्।', steps:[
    ['मिति हेर्नुहोस्','मासिक तलब महिनाको <b>1 गते</b> पाउनुपर्छ। मालिकले WPS मार्फत <b>7 दिनभित्र</b> बैंक खातामा हाल्नुपर्छ। (घरेलु कामदार: अर्को महिनाको <b>3 गते</b> भित्र।)'],
    ['प्रमाण राख्नुहोस्','सम्झौता, कतार ID, बैंक स्टेटमेन्ट वा SMS, पे-स्लिप र मेसेज राख्नुहोस्। मिति लेख्नुहोस्। फोटो खिच्नुहोस्।'],
    ['नम्र भएर मालिकलाई सोध्नुहोस्','HR वा म्यानेजरलाई सोध्नुहोस्, सकेसम्म लेखेर (मेसेज वा चिठी)। पठाएको र पाएको जवाफको प्रति राख्नुहोस्।'],
    ['श्रम मन्त्रालयमा उजुरी गर्नुहोस्','फोन गर्नुहोस् <a href="tel:16008">16008</a> वा <a href="https://www.mol.gov.qa" target="_blank" rel="noopener">mol.gov.qa</a> मा अनलाइन उजुरी प्लेटफर्म प्रयोग गर्नुहोस्। कसैले तलब पाएको छैन भने धेरै जना मिलेर सँगै उजुरी गर्न सकिन्छ।'],
    ['बैठकमा जानुहोस्','मन्त्रालयले मालिकसँग मिलाउने प्रयास गर्छ। प्रमाण र पाउनुपर्ने रकमको सूची लैजानुहोस्।'],
    ['समिति (न्यायाधीश)','मिलेन भने मुद्दा Labour Dispute Settlement Committee मा जान सक्छ। कामदारले अदालत शुल्क तिर्नुपर्दैन। सुनुवाइ अरबीमा हुन्छ, त्यसैले भाषाको सहयोग माग्नुहोस् (दूतावासले सल्लाह दिन सक्छ)।'],
    ['Workers’ Support and Insurance Fund','समितिले पैसा दिन आदेश दिएपछि पनि मालिकले दिएन भने, निर्णयको प्रति लिएर कोषमा निवेदन दिनुहोस्।'],
    ['काम बदल्नेबारे सोध्नुहोस्','2026 को कानुन अनुसार तलबको नियम तोडिएको कामदारले मालिक बदल्न वा सम्झौता अन्त्य गर्न माग गर्न सक्छ, र घर फर्कने खर्च मालिकले तिर्छ। मन्त्रालयसँग सोध्नुहोस्।'],
    ['दूतावासलाई भन्नुहोस्','तपाईंको दूतावासको श्रम शाखाले सल्लाह दिन सक्छ। हेर्नुहोस् <a href="#embassies">दूतावास</a>।']
  ], p:['<span class="note">नपाएको पैसा पाएँ भन्ने कागजमा सही नगर्नुहोस्। काममा हुँदै वा काम सकिएको 1 वर्षभित्र उजुरी गर्नुहोस्।</span>']},

  mol:{title:'श्रम मन्त्रालय (Ministry of Labour)', intro:'श्रम मन्त्रालय (MoL) काम र कामदारका लागि कतार सरकारको कार्यालय हो।', secs:[
    {t:'मन्त्रालयले के-के सहयोग गर्छ', p:[

  sources:{title:'स्रोत (सोर्स)', intro:'यो एपका हरेक जानकारी यी सरकारी वा भरपर्दो स्रोतबाट लिइएको हो।', p:[

TR.ne.pages.change={title:'काम बदल्नुहोस्', intro:'तपाईं कतारमा आफ्नो काम बदल्न सक्नुहुन्छ। यसका लागि मालिकको अनुमति (NOC) <b>चाहिँदैन</b>। यसरी गर्नुहोस्।', secs:[
  {t:'कसले काम बदल्न सक्छ?', p:[
    'हरेक कामदारले सम्झौताको बीचमा जुनसुकै बेला काम बदल्न सक्छ, <b>NOC (No Objection Certificate) बिना</b>।',
    'यसमा निजी कम्पनीका कामदार, घरेलु कामदार, र खेती तथा माछा मार्ने कामदार पनि पर्छन्।',
    '-तपाईंको कतार ID (रेसिडेन्स परमिट) मान्य हुनुपर्छ, वा सकिएको <b>90 दिन</b> नपुगेको हुनुपर्छ।',
    '-तपाईंको <b>आफ्नै नाममा</b> कतारको मोबाइल नम्बर चाहिन्छ, जुन तपाईंको कतार ID सँग जोडिएको होस्।'
  ]},
  {t:'एक-एक कदम', steps:[
    ['नयाँ काम खोज्नुहोस्','कामको स्पष्ट प्रस्ताव (अफर) लिनुहोस्। तलब, पद, सम्झौताको अवधि, प्रोबेसन, खाना र बस्ने ठाउँ – सबै हेर्नुहोस्।'],
    ['निवेदन अनलाइन हुन्छ','निवेदन श्रम मन्त्रालयको वेबसाइट <a href="https://www.mol.gov.qa" target="_blank" rel="noopener">mol.gov.qa</a> मा मात्र हुन्छ, सेवाको नाम “Change of employer within the labour market”। प्रायः नयाँ मालिकले निवेदन सुरु गर्छ र नयाँ सम्झौताको विवरण भर्छ। तपाईं आफैँले पनि सुरु गर्न सक्नुहुन्छ।'],
    ['3 दिनभित्र हेरेर स्वीकार गर्नुहोस्','तपाईंलाई SMS आउँछ। “Labors and Individuals” पोर्टलमा लग-इन गर्नुहोस्, “My Requests” खोल्नुहोस्, निवेदन छान्नुहोस्, “Take Action” थिच्नुहोस्, सबै विवरण जाँच्नुहोस्, अनि “Approve” थिच्नुहोस्। तपाईंसँग <b>3 दिन</b> हुन्छ। केही गर्नुभएन भने निवेदन आफैँ रद्द हुन्छ।'],
    ['मालिकलाई खबर जान्छ','तपाईंको अहिलेको मालिकलाई मेसेज जान्छ। उनले मन्त्रालयका लागि आफ्नो कुरा लेख्न सक्छन्, तर उनको सहमति चाहिँदैन।'],
    ['मन्त्रालयले स्वीकृति दिन्छ','तपाईंलाई SMS आउँछ, जसमा नोटिसको अन्तिम दिन लेखिएको हुन्छ। निवेदन नम्बर र SMS राख्नुहोस्।'],
    ['नोटिसको समय पूरा गर्नुहोस्','नोटिस नसकिँदासम्म अहिलेको मालिकसँग काम गरिरहनुहोस्, मालिकले नोटिस घटाउन मञ्जुर नगरेसम्म।'],
    ['नयाँ सम्झौता र नयाँ कतार ID','नोटिस सकिएको 3 महिनाभित्र नयाँ मालिकले तपाईंको नयाँ सम्झौता मन्त्रालयमा दर्ता गर्छ र नयाँ कतार ID का लागि निवेदन दिन्छ। उसले तपाईंलाई सम्झौताको प्रति र नयाँ ID दिनुपर्छ।']
  ]},
  {t:'नोटिसको समय', p:[
    '-यो मालिकसँग <b>2 वर्ष वा कम</b> काम गर्नुभयो: <b>1 महिनाको</b> नोटिस।',
    '-<b>2 वर्षभन्दा बढी</b> काम गर्नुभयो: <b>2 महिनाको</b> नोटिस।',
    '-<b>प्रोबेसनमा</b>: छोड्नुभन्दा कम्तीमा <b>1 महिना</b> अगाडि निवेदन दिनुहोस्।',
    'मालिक नोटिस घटाउन वा हटाउन मञ्जुर हुन सक्छन्। दुवै मञ्जुर भए निवेदनमा यसका लागि “Yes” छान्नुहोस्। लिखित रूपमा पनि लिनुहोस्।',
    'नोटिस सकिनुअघि छोड्नुहुन्छ? जति दिन काम गर्नुहुन्न, त्यति दिनको आधारभूत तलब मालिकलाई तिर्नुपर्छ। उदाहरण: आधारभूत तलब महिनाको QAR 1,500, 2 हप्ता अगाडि छोड्नुभयो = तपाईं QAR 750 तिर्नुहुन्छ।',
    '<b>तलब पाउनुभएन?</b> मालिकले कानुन मानेन भने (जस्तै तलब दिएन), तपाईं नोटिस बिना काम बदल्न सक्नुहुन्छ। श्रम मन्त्रालयमा उजुरी गर्नुहोस्।'
  ]},
  {t:'प्रोबेसनको समयमा', p:[
    '-प्रोबेसन बढीमा <b>6 महिना</b> हुन्छ (घरेलु कामदार: बढीमा <b>3 महिना</b>)। एउटै मालिकसँग एक पटक मात्र प्रोबेसन।',
    '-त्यो बेला पनि काम बदल्न सक्नुहुन्छ। छोड्नुभन्दा कम्तीमा 1 महिना अगाडि निवेदन दिनुहोस्।',
    '-<b>नयाँ मालिकले</b> (तपाईंले होइन) पुरानो मालिकलाई भर्ती खर्च र हवाई टिकटको केही भाग तिर्छ। यो तपाईंको 2 महिनाको आधारभूत तलबभन्दा बढी हुँदैन।'
  ]},
  {t:'शुल्क र कति समय लाग्छ', p:[
    '-मालिक बदल्न कामदारका लागि <b>निःशुल्क</b> छ।',
    '-नयाँ कतार ID का लागि तपाईंले नयाँ मालिकलाई पैसा तिर्नुपर्दैन।',
    '-कुनै तोकिएको समय सार्वजनिक गरिएको छैन। ILO का अनुसार सेप्टेम्बर 2024 मा एउटा निवेदन टुंगो लगाउन मन्त्रालयलाई औसत <b>9 दिन</b> लाग्यो। मन्त्रालयसँग पक्का गर्नुहोस्।',
    '-1 वर्ष वा बढी काम गर्नुभयो? पुरानो मालिकले तपाईंको सेवा अन्त्यको पैसा (ग्र्याच्युटी) र बाँकी बिदाको पैसा दिनुपर्छ।'
  ]},
  {t:'मालिकले नमान्दा, वा “भाग्यो” (absconding) मुद्दा हाल्दा', p:[
    '-मालिकको सहमति <b>चाहिँदैन</b>। NOC चाहिँदैन।',
    '-काम बदल्ने निवेदन दिएपछि मालिकले <b>तपाईंको कतार ID रद्द गर्न पाउँदैन</b>, र “भाग्यो” (absconding) को झूटो मुद्दा हाल्न पाउँदैन।',
    '-तपाईंको श्रम उजुरी वा काम बदल्ने निवेदन पहिल्यै चलिरहेको छ भने, त्यो जाँचेर टुंगिएपछि मात्र absconding रिपोर्ट गर्न सकिन्छ।',
    '-जानाजान झूटो absconding रिपोर्ट गरेमा सजाय हुन सक्छ।',
    '<b>मालिकले रोकिरहेको छ?</b> <a href="tel:16008">16008</a> मा फोन गर्नुहोस्, मन्त्रालयको “Unified Platform for Complaints and Whistleblowers” मा उजुरी गर्नुहोस्, <a href="mailto:info@mol.gov.qa">info@mol.gov.qa</a> मा इमेल गर्नुहोस्, वा श्रम मन्त्रालयको कार्यालयमा जानुहोस्।',
    '<b>निवेदन दिनुअघि नै कतार ID रद्द भयो?</b> पहिले मन्त्रालयमा उजुरी गर्नुहोस्। त्यसपछि Labour Relations Department का प्रमुख (Head) लाई अरबीमा सही गरेको चिठी दिनुहोस्, ID फेरि चालु गर्न माग गर्दै। साथमा कतार ID को प्रति, ID रद्द भएको SMS, र नयाँ कामको प्रस्ताव राख्नुहोस्। सबैको प्रति राख्नुहोस्।',
    'आफ्नो दूतावासलाई पनि भन्नुहोस्। हेर्नुहोस् <a href="#embassies">दूतावास</a>।'
  ]},
  {t:'थाहा पाउनुपर्ने कुरा', p:[
    '-नोटिस नदिई कतार नछोड्नुहोस्। 1 वर्षसम्म कतारमा काम गर्न फर्कन नपाउन सक्नुहुन्छ।',
    '-निवेदन जाँच हुँदै गर्दा तपाईं त्यसलाई रद्द गर्न सक्नुहुन्छ।',
    '-सरकारी वेबसाइट <b>mol.gov.qa</b> मात्र प्रयोग गर्नुहोस्। काम बदल्न मन्त्रालयले कामदारसँग पैसा लिँदैन।',
    '-घरेलु कामदारलाई पनि यही नियम लागू हुन्छ (प्रोबेसन 3 महिनासम्म)।'
  ]}
]};

TR.ne.pages.listen={title:'तपाईंको आवाज: सरकारले कसरी सुन्छ', intro:'कतारमा कामदारको कुरा सुन्ने धेरै तरिका छन्: प्रश्न सोध्न, समस्या भन्न वा सुझाव दिन।', secs:[
  {t:'श्रम मन्त्रालयको हटलाइन र अनलाइन प्लेटफर्म', p:[
    '<b>हटलाइन <a href="tel:16008">16008</a></b>, 24 घण्टा खुला। <b>आफ्नो नाम नभनी</b> पनि समस्या भन्न सक्नुहुन्छ।',
    'मन्त्रालयको अनलाइन <b>“Unified Platform for Complaints and Whistleblowers”</b> (उजुरी र गलत कामको सूचना दिने प्लेटफर्म) ले उजुरी लिन्छ, र कानुन तोड्ने कम्पनीको सूचना पनि लिन्छ।',
    'धेरैजसो उजुरी मालिकसँग कुरा गरेरै मिल्छन्। जनवरीदेखि सेप्टेम्बर 2024 सम्म प्लेटफर्ममा 22,158 उजुरी आए। करिब 73% मन्त्रालयमै मिलाइए।',
    'जनवरीदेखि मार्च 2026 मा मन्त्रालयले कामदारका 5,369 उजुरी दर्ता गर्‍यो र ती 3 महिनामै 2,797 मिलायो। मानिसहरूबाट 486 सूचना (रिपोर्ट) पनि पायो।'
  ]},
  {t:'संयुक्त समिति (Joint Committee): कामदार र म्यानेजर सँगै', p:[
    'संयुक्त समिति कम्पनीको एउटा समूह हो, जहाँ <b>कामदारले छानेका प्रतिनिधि</b> र म्यानेजर मिलेर कामका समस्याबारे कुरा गर्छन् र समाधान गर्छन्।',
    'मन्त्रालय र ILO ले 2019 देखि 2023 सम्म कम्पनीहरूमा 73 वटा परीक्षण संयुक्त समिति चलाए।',
    '<b>नयाँ कानुन (Law No. 9 of 2026):</b> <b>100 वा बढी कामदार</b> भएका कम्पनीमा संयुक्त समिति अनिवार्य छ। विस्तृत नियम मन्त्रालयको निर्णयमा आउनेछ। मन्त्रालयसँग पक्का गर्नुहोस्।',
    'आफ्नो HR लाई सोध्नुहोस्: कम्पनीमा संयुक्त समिति छ कि छैन, र तपाईंका कामदार प्रतिनिधि को हुन्।'
  ]},
  {t:'Labour Dispute Settlement Committees (श्रम विवाद समाधान समिति)', p:[
    'उजुरी मिलेन भने न्यायाधीशको नेतृत्वमा समितिले निर्णय गर्छ। कामदारले अदालत शुल्क तिर्नुपर्दैन।',
    'Law No. 9 of 2026 अनुसार यी समितिले अनलाइन (इलेक्ट्रोनिक) सुनुवाइ पनि गर्न सक्छन्।',
    'जनवरीदेखि मार्च 2026 मा यी समितिले 2,228 निर्णय दिए।'
  ]},
  {t:'Workers’ Support and Insurance Fund (कामदार सहायता तथा बीमा कोष)', p:[
    'समितिको निर्णयपछि पनि मालिकले पैसा दिएन भने यो कोषले कामदारको बाँकी रकम दिन्छ। हेर्नुहोस् <a href="#help/wsif">अहिले सहयोग</a>।',
    'कोष र मन्त्रालयले कामदारका समस्या सुन्न आप्रवासी समुदायका अगुवा (कम्युनिटी लिडर) सँग पनि भेट्छन्।'
  ]},
  {t:'National Human Rights Committee (NHRC, राष्ट्रिय मानव अधिकार समिति)', p:[
    'कामदारका उजुरी लिन्छ। हटलाइन <a href="tel:8002222">8002222</a>।',
    'हरेक वर्ष अन्तर्राष्ट्रिय श्रमिक दिवस (1 मे) तिर कामदारका लागि जनचेतना अभियान चलाउँछ।',
    'घरेलु कामदारका लागि कार्यशाला गर्छ, जहाँ उनीहरू अधिकारीहरूसँग कुरा गर्न सक्छन्, जस्तै श्रम मन्त्रालयका अधिकारी।'
  ]},
  {t:'समुदायका अगुवा र फोरम', p:[
    'मन्त्रालय र कोषले आप्रवासी समुदायका अगुवासँग भेट्छन्। अगुवाहरूले कामदारका कुरा मन्त्रालयसम्म पुर्‍याउँछन्।',
    'समुदायका अगुवाले कतारको श्रम कानुनको तालिम पाउँछन् (2024 मा 4 सत्र, मन्त्रालय र Migrant Forum Asia को सम्झौताअनुसार)।',
    'अक्टोबर 2024 मा दोहामा Community Leaders’ Forum भयो, जहाँ 19 देशका करिब 300 समुदाय प्रतिनिधिले मन्त्रालय र कोषसँग भेटे, BWI (एउटा अन्तर्राष्ट्रिय युनियन) सँग मिलेर।',
    'समुदायका समूहले मन्त्रालयको सहयोगमा अधिकारबारे सत्र पनि चलाउँछन्, जस्तै अगस्ट 2025 मा श्रम मन्त्रालयको तालिम कोठामा।'
  ]},
  {t:'ILO र युनियनका साथीहरूले तपाईंका प्रश्न पुर्‍याउँछन्', p:[
    'ILO कार्यालय, अन्तर्राष्ट्रिय ट्रेड युनियनका कम्युनिटी लियाजोँ अफिसर, र समुदायका अगुवाले कामदारका प्रश्न लिन्छन् र कारबाहीका लागि <b>श्रम मन्त्रालयमा पठाउँछन्</b>।',
    'ILO सँग सम्पर्क: हेर्नुहोस् <a href="#ilo">ILO कार्यालय</a>।'
  ]},
  {t:'विश्वकपको विरासत: Workers’ Welfare Forum (कामदार कल्याण फोरम)', p:[
    'FIFA World Cup 2022 का परियोजनामा Supreme Committee for Delivery & Legacy को <b>Workers’ Welfare Standards</b> अनुसार कामदार बस्ने हरेक ठाउँ (क्याम्प) मा Workers’ Welfare Forum हुनुपर्थ्यो।',
    'कामदारले आफ्ना प्रतिनिधि छान्थे (हरेक देशबाट एक जना)। फोरम महिनामा कम्तीमा एक पटक बस्थ्यो, र कामदारले सजायको डर बिना आफ्नो कुरा राख्न सक्थे।'
  ]}
]};

TR.ne.pages.campaigns={title:'अभियान र जनचेतना', intro:'श्रम मन्त्रालय र साझेदारहरूले कामदारलाई आफ्नो अधिकार थाहा दिन र सुरक्षित राख्न अभियान चलाउँछन्।', secs:[
  {t:'गर्मीबाट बचाउ अभियान 2026 (Heat Stress Prevention Campaign)', p:[
    '<b>1 जुनदेखि 15 सेप्टेम्बर 2026</b> सम्म चल्यो, मन्त्रालयको Occupational Safety and Health (कामको सुरक्षा र स्वास्थ्य) विभागको नेतृत्वमा।',
    'साझेदार: Ministry of Public Health (स्वास्थ्य मन्त्रालय), Workers’ Support and Insurance Fund, Ministry of Education and Higher Education, Public Works Authority, Qatar Red Crescent, र डेलिभरी कम्पनी Snoonu, Talabat, Rafeeq र Keeta।',
    '-धेरै भाषामा जानकारी सामग्री।',
    '-कामदार र मालिकका लागि सेमिनार र तालिम।',
    '-निरीक्षण: दिउँसो काम रोक्ने नियम तोडेकोमा <b>388 कामका ठाउँ बन्द गरिए</b> (हरेक 3 दिनका लागि)।',
    'मन्त्रालयका अनुसार निरीक्षण र जनचेतना वर्षभरि चल्छ। हेर्नुहोस् <a href="#rights/heat">गर्मीबाट सुरक्षा</a>।'
  ]},
  {t:'गर्मीका अभियानले के सिकाउँछन्', p:[
    '<b>गर्मी लाग्दा (हिट स्ट्रेस) का लक्षण:</b> रिँगटा लाग्नु, टाउको दुख्नु, धेरै पसिना आउनु (वा पसिना नै नआउनु), थकाइ, बेहोस हुनु।',
    '<b>के गर्ने:</b> काम रोक्नुहोस्, छायाँमा जानुहोस्, पानी पिउनुहोस्, र चाहिए डाक्टरको सहयोग लिनुहोस्। आपतकाल: <a href="tel:999">999</a>।',
    '<b>बचाउ:</b> बारम्बार पानी पिउनुहोस्, छायाँमा आराम गर्नुहोस्, बाहिर हल्का लुगा र टाउको छोप्ने सामान लगाउनुहोस्।'
  ]},
  {t:'पहिलेका गर्मी अभियान', p:[
    '-<b>2025:</b> स्वास्थ्य मन्त्रालय र कोषसँग देशभर अभियान। 21 जुन 2025 मा एसियन टाउनमा कामदारलाई धेरै भाषामा छापिएका सामग्री दिइयो।',
    '-<b>2024:</b> विशेष निरीक्षण; नियम तोडेकोमा 368 कामका ठाउँ बन्द गरिए।',
    '-<b>2024:</b> BWI (एउटा अन्तर्राष्ट्रिय युनियन) र मन्त्रालयको संयुक्त गर्मी अभियान 25 कम्पनी र समुदायका 2,824 भन्दा बढी कामदारसम्म पुग्यो।'
  ]},
  {t:'सुरक्षा निरीक्षण र सेमिनार', p:[
    'जनवरीदेखि मार्च 2026 मा मन्त्रालयको सुरक्षा र स्वास्थ्य विभागले <b>355 जनचेतना कार्यक्रम</b> चलायो, 5,918 कामका ठाउँ निरीक्षण गर्‍यो र कामदार बस्ने ठाउँमा 2,322 पटक पुग्यो।',
    'जनवरी 2026 मा कम्पनी, स्वास्थ्य मन्त्रालय र कोषसँग मिलेर कामदारका लागि निर्माण सुरक्षाबारे सेमिनार भए।'
  ]},
  {t:'आफ्नो अधिकार जान्नुहोस्: धेरै भाषामा गाइड', p:[

/* ============================ ENGINE ============================ */
var LANGS = ['en','hi','bn','ne'];
var LANG_NAMES = {en:'English', hi:'\u0939\u093F\u0928\u094D\u0926\u0940', bn:'\u09AC\u09BE\u0982\u09B2\u09BE', ne:'\u0928\u0947\u092A\u093E\u0932\u0940'};
var LS_KEY = 'workerInfoLang';
var app = document.getElementById('app');
var ICON = {tel:'\uD83D\uDCDE', wa:'\uD83D\uDCAC', mail:'\u2709\uFE0F', web:'\uD83D\uDD17'};
if(typeof TR==='undefined') var TR={};

/* deep merge: objects by key; arrays of objects by index; arrays of strings/arrays are replaced */
function merge(base, tr){
  if(tr===undefined || tr===null) return base;
  if(Array.isArray(base) && Array.isArray(tr)){
    var objs = base.length && typeof base[0]==='object' && !Array.isArray(base[0]);
    if(!objs) return tr.map(function(x,i){ return (x===null||x===undefined) ? base[i] : x; }); /* null = keep English (e.g. addresses) */
    return base.map(function(b,i){ return merge(b, tr[i]); });
  }
  if(base && typeof base==='object' && !Array.isArray(base) && typeof tr==='object' && !Array.isArray(tr)){
    var o={}; Object.keys(base).forEach(function(k){o[k]=merge(base[k],tr[k]);});
    Object.keys(tr).forEach(function(k){ if(!(k in base)) o[k]=tr[k]; });
    return o;
  }
  return tr;
}
function getLang(){
  var l=null;
  try{ l=localStorage.getItem(LS_KEY); }catch(e){}
  if(LANGS.indexOf(l)<0){
    var nl=((navigator.languages&&navigator.languages[0])||navigator.language||'en').slice(0,2).toLowerCase();
    l = LANGS.indexOf(nl)>-1 ? nl : 'en';
  }
  return l;
}
var LANG=getLang(), S=null, INDEX=null;
function loadLang(l){
  LANG = LANGS.indexOf(l)>-1 ? l : 'en';
  S = LANG==='en' ? STR.en : merge(STR.en, TR[LANG]);
  INDEX=null;
  document.documentElement.lang = LANG;
}
function setLang(l){
  try{ localStorage.setItem(LS_KEY,l); }catch(e){}
  loadLang(l); applyChrome(); route();
}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function strip(s){return String(s).replace(/<[^>]+>/g,' ').replace(/&[a-z]+;/g,' ').replace(/\s+/g,' ').trim();}
/* normalise for search: lower case, drop nukta, chandrabindu -> anusvara */
function norm(s){
  s=String(s).toLowerCase();
  if(s.normalize) s=s.normalize('NFD');
  return s.replace(/[\u093C\u09BC]/g,'').replace(/\u0901/g,'\u0902').replace(/\u0981/g,'\u0982').replace(/\u200C|\u200D/g,'');
}

function renderParas(arr){
  var h='', inList=false;
  (arr||[]).forEach(function(line){
    if(line.charAt(0)==='-'){ if(!inList){h+='<ul>';inList=true;} h+='<li>'+line.slice(1)+'</li>'; }
    else { if(inList){h+='</ul>';inList=false;} h+='<p>'+line+'</p>'; }
  });
  if(inList) h+='</ul>';
  return h;
}
function contactBtns(key, big){
  var c=CONTACTS[key]; if(!c) return '';
  var h='<div class="btns">';
  c.items.forEach(function(it){
    var href, cls='btn', label;
    if(it.k==='tel'){href='tel:'+it.v;label=S.ui.call+' '+it.d;}
    else if(it.k==='wa'){href='https://wa.me/'+it.v;cls+=' wa';label=S.ui.wa+' '+it.d;}
    else if(it.k==='mail'){href='mailto:'+it.v;cls+=' mail';label=S.ui.mail+' '+it.d;}
    else {href=it.v;cls+=' web';label=S.ui.web+' '+it.d;}
    if(it.n && S.ui.notes && S.ui.notes[it.n]) label+=' ('+S.ui.notes[it.n]+')';
    if(big && it.k==='tel') cls+=' big';
    if(key==='e999') cls+=' red';
    var ext = (it.k==='web'||it.k==='wa') ? ' target="_blank" rel="noopener"' : '';
    h+='<a class="'+cls+'" href="'+esc(href)+'"'+ext+'><span class="em" aria-hidden="true">'+ICON[it.k]+'</span><span dir="auto">'+esc(label)+'</span></a>';
  });
  return h+'</div>';
}
var SRC_IDS=Object.keys(SOURCES);
function srcLinks(ids){
  if(!ids||!ids.length) return '';
  return '<div class="src">'+esc(S.ui.srcLabel)+': '+ids.map(function(id){
    return '<a href="#sources/'+id+'">['+(SRC_IDS.indexOf(id)+1)+']</a>';
  }).join(' ')+'</div>';
}
function stepsHtml(steps){
  return '<ol class="steps">'+steps.map(function(s){return '<li><span class="st">'+s[0]+'</span>'+s[1]+'</li>';}).join('')+'</ol>';
}
function secHtml(pageKey, sec, forceOpen){
  var c='';
  if(sec.steps) c+=stepsHtml(sec.steps);
  c+=renderParas(sec.p);
  (sec.c||[]).forEach(function(k){c+=contactBtns(k);});
  var src=sec.src;
  if(!src){ (sec.c||[]).forEach(function(k){ var cs=CONTACTS[k]; if(cs&&cs.src&&!src) src=cs.src; }); }
  c+=srcLinks(src);
  var open = (sec.open||forceOpen) ? ' open' : '';
  return '<details class="sec" id="'+pageKey+'-'+sec.id+'"'+open+'><summary><span class="em" aria-hidden="true">'+sec.em+'</span><span class="t">'+sec.t+'</span></summary><div class="body">'+c+'</div></details>';
}
function langButtons(){
  return '<div class="langs" role="group" aria-label="Language"><span class="lh">\uD83C\uDF10 '+esc(S.ui.langLabel)+(LANG!=='en'?' / Language':'')+'</span>'+
    LANGS.map(function(l){return '<button type="button" class="langbtn l-'+l+'" lang="'+l+'" aria-pressed="'+(l===LANG)+'" onclick="setLang(\''+l+'\')">'+LANG_NAMES[l]+'</button>';}).join('')+'</div>';
}

function viewHome(){
  var H=S.home, h='';
  h+='<div class="hero"><h1>'+esc(H.hello)+'</h1><p>'+esc(H.intro)+'</p></div>';
  h+=langButtons();
  h+='<form class="search" role="search" onsubmit="doSearch(event)"><input id="q" type="search" enterkeyhint="search" aria-label="'+esc(S.ui.searchGo)+'" placeholder="'+esc(S.ui.searchPh)+'"><button aria-label="'+esc(S.ui.searchGo)+'">\uD83D\uDD0D</button></form>';
  h+='<div class="grid">'+H.tiles.map(function(t){
    return '<a class="tile'+(t.red?' red':'')+(t.wide?' wide':'')+'" href="#'+t.r+'"><span class="em" aria-hidden="true">'+t.em+'</span><span class="tx"><b>'+esc(t.b)+'</b><small>'+esc(t.s)+'</small></span></a>';
  }).join('')+'</div>';
  h+='<a class="banner" href="#salary"><span class="em" aria-hidden="true">\u23F3</span><span><b>'+esc(H.salaryB)+'</b><small>'+esc(H.salaryS)+'</small></span></a>';
  h+='<div class="links"><a class="chip" href="#sources">\uD83D\uDCDA '+esc(S.ui.sources)+'</a><a class="chip" href="#about">\u2139\uFE0F '+esc(S.ui.about)+'</a>'+
     (navigator.share?'<a class="chip" href="#" onclick="shareApp(event)">\uD83D\uDCE4 '+esc(S.ui.share)+'</a>':'')+'</div>';
  h+='<p class="src" style="text-align:center">'+esc(S.ui.offline)+' '+esc(S.ui.lastChecked)+'</p>';
  return h;
}
function viewPage(key, focus){
  var P=S.pages[key]; if(!P) return null;
  var h='<h1>'+(P.em?'<span aria-hidden="true">'+P.em+'</span> ':'')+P.title+'</h1>';
  if(P.intro) h+='<p class="lead">'+P.intro+'</p>';
  (P.top||[]).forEach(function(k){h+='<div class="card top"><h3>'+esc((S.ui.cn&&S.ui.cn[k])||'')+'</h3>'+contactBtns(k,true)+srcLinks(CONTACTS[k].src)+'</div>';});
  if(P.steps) h+=stepsHtml(P.steps);
  if(P.secs) P.secs.forEach(function(s){h+=secHtml(key,s,focus===s.id);});
  if(P.p) h+=renderParas(P.p);
  if(P.maker) h+='<div class="card"><p><b>'+esc(S.ui.contact)+':</b> <a href="mailto:nimrodkariuki19@gmail.com">nimrodkariuki19@gmail.com</a></p></div>';
  if(key==='about') h+=langButtons();
  if(P.src) h+=srcLinks(P.src);
  if(key==='sources'){
    SRC_IDS.forEach(function(id,i){
      var s=SOURCES[id];
      h+='<div class="srcitem" id="src-'+id+'" lang="en"><b>['+(i+1)+'] '+esc(s.t)+'</b><br><a href="'+esc(s.u)+'" target="_blank" rel="noopener">'+esc(s.u)+'</a></div>';
    });
  }
  return h;
}

/* ---------- search (current language + English, so both work) ---------- */
function secText(s){
  var txt=s.t+' '+(s.p||[]).join(' ')+' '+(s.steps||[]).map(function(x){return x.join(' ');}).join(' ');
  (s.c||[]).forEach(function(k){CONTACTS[k].items.forEach(function(it){txt+=' '+it.d;});});
  return strip(txt);
}
function buildIndex(){
  INDEX=[];
  var E=STR.en;
  Object.keys(S.pages).forEach(function(pk){
    var P=S.pages[pk], PE=E.pages[pk]||{};
    (P.secs||[]).forEach(function(s,i){
      var se=(PE.secs||[])[i]||{};
      var t=secText(s), te=(LANG==='en')?'':secText(se);
      INDEX.push({page:pk, id:s.id, title:strip(s.t), ptitle:strip(P.title), text:t, n:norm(t+' '+te), nt:norm(s.t+' '+(se.t||''))});
    });
    if(P.steps){
      var t=strip(P.intro+' '+P.steps.map(function(x){return x.join(' ');}).join(' '));
      var te=(LANG==='en')?'':strip((PE.intro||'')+' '+(PE.steps||[]).map(function(x){return x.join(' ');}).join(' '));
      INDEX.push({page:pk, id:'', title:strip(P.title), ptitle:strip(P.title), text:t, n:norm(t+' '+te), nt:norm(P.title+' '+(PE.title||''))});
    }
  });
}
function doSearch(e){ if(e) e.preventDefault(); var q=document.getElementById('q').value.trim(); if(q) location.hash='#search/'+encodeURIComponent(q); }
function viewSearch(q){
  if(!INDEX) buildIndex();
  var words=norm(q).split(/\s+/).filter(Boolean);
  var res=INDEX.map(function(r){
    var score=0;
    words.forEach(function(w){ if(r.nt.indexOf(w)>-1) score+=5; var i=r.n.indexOf(w); while(i>-1){score++; i=r.n.indexOf(w,i+1);} });
    return {r:r,score:score};
  }).filter(function(x){return x.score>0;}).sort(function(a,b){return b.score-a.score;}).slice(0,20);
  var h='<form class="search" role="search" onsubmit="doSearch(event)"><input id="q" type="search" enterkeyhint="search" value="'+esc(q)+'" aria-label="'+esc(S.ui.searchGo)+'" placeholder="'+esc(S.ui.searchPh)+'"><button aria-label="'+esc(S.ui.searchGo)+'">\uD83D\uDD0D</button></form>';
  h+='<h1>'+esc(S.ui.resultsFor)+' \u201C'+esc(q)+'\u201D</h1>';
  if(!res.length) h+='<p>'+esc(S.ui.noResults)+'</p>';
  res.forEach(function(x){
    var r=x.r, t=r.text, i=t.toLowerCase().indexOf(q.toLowerCase().split(/\s+/)[0]); var start=Math.max(0,i-40);
    var snip=(start>0?'\u2026':'')+t.substr(start,130)+'\u2026';
    h+='<a class="res" href="#'+r.page+(r.id?'/'+r.id:'')+'"><b>'+esc(r.title)+'</b><small>'+esc(r.ptitle)+' \u00B7 '+esc(snip)+'</small></a>';
  });
  return h;
}

/* ---------- router ---------- */
var STACK=[];
function route(){
  var hash=decodeURIComponent(location.hash.replace(/^#/,''))||'home';
  var parts=hash.split('/'), key=parts[0], sub=parts.slice(1).join('/');
  var html=null, title=S.ui.title;
  if(key==='home') html=viewHome();
  else if(key==='search') html=viewSearch(sub);
  else if(S.pages[key]){ html=viewPage(key, key==='sources'?null:sub); title=strip(S.pages[key].title)+' \u2013 '+S.ui.title; }
  if(html===null){ key='home'; html=viewHome(); }
  app.innerHTML=html;
  document.title=title;
  var isHome=(key==='home');
  document.getElementById('backBtn').hidden=isHome;
  document.getElementById('homeBtn').hidden=isHome;
  if(sub && key==='sources'){
    var el=document.getElementById('src-'+sub); if(el){el.classList.add('hl'); el.scrollIntoView({block:'center'}); return;}
  } else if(sub && key!=='search'){
    var d=document.getElementById(key+'-'+sub); if(d){d.open=true; d.scrollIntoView({block:'start'}); window.scrollBy(0,-70); return;}
  }
  window.scrollTo(0,0);
}
function applyChrome(){
  document.getElementById('appTitle').textContent=S.ui.title;
  document.getElementById('appSub').textContent=S.ui.madeBy;
  document.getElementById('backBtn').setAttribute('aria-label',S.ui.back);
  document.getElementById('homeBtn').setAttribute('aria-label',S.ui.home);
  var sel=document.getElementById('langSel');
  sel.setAttribute('aria-label',S.ui.langLabel+' / Language');
  sel.innerHTML=LANGS.map(function(l){return '<option value="'+l+'" lang="'+l+'"'+(l===LANG?' selected':'')+'>'+LANG_NAMES[l]+'</option>';}).join('');
  sel.className='langsel l-'+LANG;
  document.getElementById('foot').innerHTML=esc(S.ui.footer)+'<br><a href="#about">'+esc(S.ui.about)+'</a> \u00B7 <a href="#sources">'+esc(S.ui.sources)+'</a> \u00B7 '+esc(S.ui.lastChecked)+'<br>'+esc(S.ui.madeBy);
}
document.getElementById('langSel').addEventListener('change',function(){ setLang(this.value); });
document.getElementById('backBtn').addEventListener('click',function(){ if(STACK.length>1) history.back(); else location.hash='#home'; });
function track(){ var h=location.hash||'#home'; if(STACK.length>1 && STACK[STACK.length-2]===h) STACK.pop(); else if(STACK[STACK.length-1]!==h) STACK.push(h); }
window.addEventListener('hashchange',function(){track(); route();});
function shareApp(e){ e.preventDefault(); try{ navigator.share({title:S.ui.title,text:S.ui.shareText,url:location.href.split('#')[0]}).catch(function(){}); }catch(err){} }

loadLang(LANG);
applyChrome();
track();
route();

/* ---------- optional PWA (only when served over http/https next to manifest + sw.js) ---------- */
(function(){
  if(!/^https?:$/.test(location.protocol) || !('fetch' in window)) return;
  fetch('manifest.webmanifest',{method:'HEAD'}).then(function(r){
    if(!r.ok) return;
    var l=document.createElement('link'); l.rel='manifest'; l.href='manifest.webmanifest'; document.head.appendChild(l);
    if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
  }).catch(function(){});
})();

</script>
