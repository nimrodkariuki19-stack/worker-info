<style>
:root{--brand:#8A1538;--brand-d:#6b0f2b;--ink:#1d1d1f;--muted:#555;--bg:#f6f3f4;--card:#fff;--line:#e3dadd;--ok:#0b7a3b;--wa:#128C7E;--info:#1f5fbf;--warn:#fff4d6;--warn-b:#e0b64a;--red:#c62828}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;font-size:18px;line-height:1.5;color:var(--ink);background:var(--bg)}
a{color:var(--info)}
html:lang(hi) body,html:lang(ne) body,html:lang(hi) input,html:lang(ne) input,html:lang(hi) select,html:lang(ne) select{font-family:"Noto Sans Devanagari","Nirmala UI","Mangal","Kohinoor Devanagari",system-ui,Roboto,"Noto Sans",sans-serif;line-height:1.65}
html:lang(bn) body,html:lang(bn) input,html:lang(bn) select{font-family:"Noto Sans Bengali","Nirmala UI","Vrinda","Shonar Bangla","Kohinoor Bangla",system-ui,Roboto,"Noto Sans",sans-serif;line-height:1.65}
.l-hi,.l-ne{font-family:"Noto Sans Devanagari","Nirmala UI","Mangal","Kohinoor Devanagari",sans-serif}
.l-bn{font-family:"Noto Sans Bengali","Nirmala UI","Vrinda","Shonar Bangla","Kohinoor Bangla",sans-serif}
.l-en{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 12px 24px}
header.top{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
header.top .bar{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:6px 8px;min-height:60px}
.iconbtn{appearance:none;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:22px;min-width:48px;min-height:48px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
.iconbtn:active{background:rgba(255,255,255,.3)}
.iconbtn[hidden]{display:none}
.langsel{appearance:none;-webkit-appearance:none;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.15);color:#fff;font-size:16px;font-weight:700;min-height:48px;max-width:120px;padding:6px 26px 6px 10px;border-radius:12px;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 14px) 21px,calc(100% - 9px) 21px;background-size:5px 5px;background-repeat:no-repeat}
.langsel option{color:#000;background:#fff}
.langs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.langs .lh{grid-column:1/-1;font-size:15px;color:var(--muted);font-weight:700}
.langbtn{min-height:52px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);font-size:17px;font-weight:700;padding:4px 2px;cursor:pointer}
.langbtn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;font-size:13px;opacity:.9}
h1{font-size:24px;line-height:1.25;margin:18px 0 6px}
h2{font-size:20px;margin:22px 0 8px}
p{margin:8px 0}
.lead{font-size:18px;color:var(--muted);margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;min-height:124px;padding:12px 8px;border-radius:18px;background:var(--card);border:2px solid var(--line);color:var(--ink);text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tile:active{transform:scale(.98);background:#fbeff3}
.tile .em{font-size:38px;line-height:1}
.tile b{font-size:18px;line-height:1.2}
.tile small{font-size:14px;color:var(--muted);line-height:1.25}
.tile.red{background:var(--red);border-color:var(--red);color:#fff}
.tile.red small{color:#fff}
.tile.wide{grid-column:1/-1;flex-direction:row;min-height:84px;gap:14px}
.tile .tx{display:flex;flex-direction:column;gap:2px}
.tile.wide .tx{text-align:left}
.banner{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--warn);border:2px solid var(--warn-b);color:var(--ink);text-decoration:none;min-height:64px;margin:10px 0}
.banner .em{font-size:32px}
.banner b{display:block;font-size:18px}
.banner small{display:block;color:#5a4a1a;font-size:15px}
.search{display:flex;gap:8px;margin:12px 0}
.search input{flex:1;min-width:0;font-size:18px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;min-height:52px;background:#fff}
.search input:focus{outline:3px solid #f0b9c9;border-color:var(--brand)}
.search button{min-width:56px;min-height:52px;border:0;border-radius:14px;background:var(--brand);color:#fff;font-size:22px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:10px 14px;border-radius:999px;background:#fff;border:2px solid var(--line);color:var(--ink);text-decoration:none;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card h3{margin:0 0 6px;font-size:19px;line-height:1.3}
.card .sub{color:var(--muted);font-size:15px;margin:0 0 8px}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.05);overflow:hidden}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;font-weight:700;font-size:18px;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .em{font-size:28px;width:36px;text-align:center;flex:none}
details.sec>summary .t{flex:1}
details.sec>summary::after{content:"+";font-size:26px;color:var(--brand);font-weight:700;flex:none}
details.sec[open]>summary::after{content:"–"}
details.sec[open]>summary{border-bottom:1px solid var(--line);background:#fbf6f7}
.body{padding:6px 16px 14px}
.body ul,.body ol{padding-left:22px;margin:8px 0}
.body li{margin:6px 0}
span.note{display:block}
.note{background:var(--warn);border-left:5px solid var(--warn-b);padding:10px 12px;border-radius:10px;margin:10px 0;font-size:16px}
.src{font-size:14px;color:var(--muted);margin-top:10px}
.src a{color:var(--muted)}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.btn{display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 14px;border-radius:14px;text-decoration:none;font-weight:700;font-size:17px;color:#fff;background:var(--ok);word-break:break-word}
.btn .em{font-size:22px;flex:none}
.btn.wa{background:var(--wa)}
.btn.mail{background:var(--info)}
.btn.web{background:#4a4a4a}
.btn.big{min-height:64px;font-size:21px;justify-content:center}
.btn.red{background:var(--red)}
.btn:active{filter:brightness(.9)}
.steps{counter-reset:s;list-style:none;padding:0;margin:10px 0}
.steps>li{counter-increment:s;position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px 62px;margin:10px 0;min-height:56px}
.steps>li::before{content:counter(s);position:absolute;left:12px;top:12px;width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:19px}
.steps>li .st{display:block;font-size:18px;font-weight:800}
.body ol.steps{padding-left:0}
.card.top{border:2px solid var(--line)}
.card.top h3{font-size:17px;color:var(--muted);font-weight:700}
.srcitem{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px;word-break:break-word}
.srcitem:target,.srcitem.hl{outline:3px solid var(--warn-b)}
.srcitem b{font-size:16px}
.res{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;text-decoration:none;color:var(--ink);min-height:48px}
.res small{display:block;color:var(--muted);font-size:14px}
footer.foot{max-width:640px;margin:0 auto;padding:10px 14px 30px;font-size:14px;color:var(--muted);text-align:center}
footer.foot a{color:var(--muted)}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;border-radius:18px;padding:16px;margin:12px 0}
.hero h1{margin:0 0 4px;color:#fff}
.hero p{margin:0;opacity:.95}
.tag{display:inline-block;background:#ffe3ea;color:var(--brand-d);border-radius:8px;padding:1px 8px;font-size:13px;font-weight:700;vertical-align:middle}
@media (max-width:340px){.grid{grid-template-columns:1fr}.tile{min-height:96px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  pages:{

  rights:{title:'My Rights', em:'\u2696\uFE0F',
    intro:'These are your main rights under Qatar law. Tap a topic to open it.',
    secs:[
    {id:'minwage', em:'\uD83D\uDCB0', t:'Minimum wage', p:[
      'Every worker in Qatar must get at least <b>QAR 1,000</b> basic pay each month.',
      'This includes domestic workers. It does not matter which country you are from or what job you do.',
      '-If your employer does <b>not</b> give you food: you must also get at least <b>QAR 300</b> for food.',
      '-If your employer does <b>not</b> give you housing: you must also get at least <b>QAR 500</b> for housing.',
      '-No food and no housing from your employer = at least <b>QAR 1,800</b> a month in total.',
      'Your employer cannot lower your pay because of this law.',
      'The law (Law No. 17 of 2020) started on 20 March 2021. A committee reviews the amount. Check with the Ministry for any change.'
    ], src:['ILO_MW','ILO_REG']},
    {id:'ontime', em:'\uD83D\uDCC5', t:'Salary on time', p:[
      'Your employer must pay your salary into your bank account in Qatar. This is called the <b>Wage Protection System (WPS)</b>.',
      '-<b>New rule from 9 September 2026:</b> a monthly salary is due on the <b>1st day</b> of each month.',
      '-Your employer must transfer it within <b>7 days</b> of that date.',
      '-If you are not paid monthly, your pay is due every 2 weeks.',
      'The Ministry watches WPS. Companies that do not pay can be blocked from Ministry services.',
      '<b>Domestic workers:</b> salary is due at the end of the month, and no later than the 3rd day of the next month. It can be paid into your bank account, or in cash with a receipt you sign.',
      '<b>New law in 2026:</b> if your employer breaks the salary rules, you may ask to change employer or end your contract. The employer then pays your cost to go home. Ask the Ministry of Labour.',
      '<a href="#salary">What to do if your salary is late \u2192</a>'
    ], src:['WPS_2026','ILO_REP','ILO_KYR','LAW9_CM','LAW9_QNA']},
    {id:'passport', em:'\uD83D\uDEC2', t:'Your passport', p:[
      'Your passport belongs to <b>you</b>.',
      'It is against the law for your employer to take and keep your passport.',
      'Your employer can keep it only if <b>you ask in writing</b>.',
      'An employer who takes a passport can be fined up to <b>QAR 25,000</b>.',
      'If your employer gives you housing, you must have your own locker that you can lock and open at any time, to keep your documents safe.'
    ], src:['ILO_REG','ILO_KYR']},
    {id:'fees', em:'\uD83D\uDEAB', t:'Recruitment fees are illegal', p:[
      'It is against the law to make workers pay recruitment fees or recruitment costs.',
      'Your employer must not cut recruitment costs from your salary.',
      '<b>Domestic workers:</b> the standard contract says the agency or employer pays the recruitment fees. Nothing can be cut from your pay.',
      'If you were made to pay, tell the Ministry of Labour (16008) and your embassy.'
    ], src:['ILO_REG']},
    {id:'change', em:'\uD83D\uDD04', t:'Changing your job', p:[
      'You can change employer <b>without a No Objection Certificate (NOC)</b>. This has been the law since 2020.',
      'You give notice on the Ministry of Labour online system.',
      '-Worked <b>2 years or less</b>: 1 month notice.',
      '-Worked <b>more than 2 years</b>: 2 months notice.',
      '-<b>During probation:</b> 1 month notice. The new employer may have to pay your old employer part of the recruitment cost (not more than 2 months of your basic pay). The law puts this on the new employer.',
      'Keep working during the notice period, unless you and your employer agree something else.',
      'You can change job while your residence permit (Qatar ID) is valid, or within 90 days after it ends.',
      'Since May 2024 the Ministry has a new online job change platform. The new employer enters the job details (pay, job title, contract). You check them and accept or reject.',
      'Domestic workers can change jobs too.',
      '<span class="note">If you leave without giving notice, you may have to pay your employer your basic pay for the notice period. Ask the Ministry first.</span>',
      '<a href="#change">Full step-by-step guide: Change Jobs \u2192</a>'
    ], src:['ILO_REG','ILO_KYR','ILO_2026','ILO_REP']},
    {id:'leave-qatar', em:'\u2708\uFE0F', t:'Leaving Qatar (no exit permit)', p:[
      'Most workers do <b>not</b> need an exit permit or the employer\u2019s permission to leave Qatar, for a holiday or for good.',
      'Only a few senior jobs (not more than 5% of a company\u2019s workers) can need permission. Domestic workers never need an exit permit.',
      '<b>Domestic workers:</b> tell your employer at least <b>72 hours</b> before you travel. Saying it or writing it is enough. You do not need their approval.',
      'If you are stopped from leaving, you can go to the Expatriates\u2019 Exit Appeals Committee. It should decide within 3 working days.',
      'Want to end your contract and go home? Give notice through the Ministry system (same notice times as changing job).',
      'Before you leave for good, try to get your salary and end-of-service money. If you have a complaint open, ask the Ministry what to do before you travel.'
    ], src:['ILO_REG','ILO_KYR','ILO_REP','ILO_2026']},
    {id:'hours', em:'\u23F0', t:'Working hours and overtime', p:[
      '-Normal work: up to <b>8 hours a day</b>, <b>48 hours a week</b>.',
      '-Ramadan: up to <b>6 hours a day</b>, <b>36 hours a week</b>.',
      '-With overtime, total work must <b>not go over 10 hours a day</b>.',
      '-Overtime pay: at least your normal hourly pay <b>+ 25%</b>.',
      '-Some night overtime is paid at least 150% (not for shift workers). Ask the Ministry.',
      '<b>Security guards, cleaners</b> and some other jobs have a special rule: total work, with overtime, must not go over <b>12 hours a day</b>.',
      'Senior managers are not covered by these hour limits.',
      'Overtime is counted on at least the minimum basic wage.',
      '<b>Domestic workers:</b> not more than 10 hours a day (normally 8 hours + up to 2 hours overtime), not counting breaks for rest, food and prayer.'
    ], src:['ILO_REG','ILO_MW','ILO_KYR']},
    {id:'rest', em:'\uD83D\uDE34', t:'Weekly day off', p:[
      'You have the right to <b>1 day off every week</b>.',
      '<b>Domestic workers:</b> a paid day off of at least <b>24 hours in a row</b>. You work on that day only if you agree. Then you get another day off, and extra pay (normal pay + at least 150%).'
    ], src:['ILO_REG','ILO_KYR']},
    {id:'annual', em:'\uD83C\uDFD6\uFE0F', t:'Annual leave (holiday)', p:[
      '-After 1 year of work: at least <b>3 weeks</b> paid leave each year.',
      '-After <b>5 years</b> with the employer: at least <b>4 weeks</b>.',
      '<b>Domestic workers:</b> 3 weeks paid leave each year. Also a <b>return air ticket home every 2 years</b>, paid by the employer.'
    ], src:['ILO_REG','ILO_KYR']},
    {id:'sick', em:'\uD83E\uDD12', t:'Sick leave', p:[
      '-After 3 months of work: up to <b>2 weeks</b> sick leave with <b>full pay</b>.',
      '-Then up to <b>4 more weeks</b> with <b>half pay</b>. After that, sick leave is unpaid.',
      'Get a report from a doctor and keep a copy.',
      '<b>Domestic workers:</b> up to 2 weeks paid sick leave each year, after the first 3 months.'
    ], src:['ILO_REG','ILO_KYR']},
    {id:'gratuity', em:'\uD83C\uDF81', t:'End-of-service money (gratuity)', p:[
      'If you worked for <b>1 year or more</b>, you get end-of-service money when your job ends.',
      'It is at least <b>3 weeks of basic pay for every year</b> you worked. Part of a year counts too.',
      'It must be counted on at least the minimum basic wage (QAR 1,000).',
      '<b>Domestic workers</b> have the same right: at least 3 weeks\u2019 pay for each year.',
      'Not paid? Complain to the Ministry of Labour. See <a href="#help">Get Help Now</a>.'
    ], src:['ILO_REG','ILO_MW','ILO_KYR']},
    {id:'heat', em:'\u2600\uFE0F', t:'Summer heat protection', p:[
      '<b>1 June to 15 September:</b> outdoor work is <b>banned from 10:00 am to 3:30 pm</b>.',
      'This also covers shaded places that have no good air flow (ventilation).',
      'At <b>any time of year</b>, work must stop if the heat stress level (WBGT) goes above <b>32.1\u00B0C</b>.',
      '-Your employer must give you <b>cold drinking water</b>.',
      '-Your employer must give you <b>shaded rest areas</b>.',
      '-Your employer must give you protective clothing and equipment suitable for hot weather.',
      '-The work schedule must be put up where all workers can see it.',
      'You may <b>stop work</b> and complain if you really believe the heat is a danger to your health. Tell your supervisor. You cannot be dismissed or treated unfairly for this.',
      'Employers must pay for yearly health check-ups for workers.',
      'Report heat rule breaking: Ministry of Labour <a href="tel:16008">16008</a>. Very sick from heat? Call <a href="tel:999">999</a>.'
    ], src:['HEAT_1','HEAT_2','HEAT_3','ILO_REG']},
    {id:'health', em:'\uD83C\uDFE5', t:'Health care and health card', p:[
      'Get a <b>health card</b>. With it you can use government health centres (PHCC) and Hamad hospitals, at lower (subsidised) prices.',
      'Go to the PHCC health centre nearest to where you live. Take:',
      '-your valid Qatar ID (QID)',
      '-one photo, 4 cm \u00D7 3 cm',
      '-a utility bill (phone, water or electricity) showing where you live',
      '-a bank card to pay. <b>Cash is not accepted.</b>',
      'Fee: <b>QAR 100</b> for adult residents. Domestic staff: QAR 50 (also bring your sponsor\u2019s QID).',
      '<b>Domestic workers:</b> your employer must pay for your medical care and medicine, and for your health card.',
      'Emergency? Call <a href="tel:999">999</a>.'
    ], src:['PHCC','ILO_KYR']},
    {id:'housing', em:'\uD83C\uDFE0', t:'Safe housing and food', p:[
      'If your employer gives you housing, it must meet the official housing standards (Ministerial Decision No. 18 of 2014).',
      'Each worker must have a personal locker that can be locked and opened at any time.',
      'If your employer gives food: <b>3 meals a day</b>, healthy, enough, and suitable for your culture.',
      'Bad or unsafe housing? Report it to the Ministry of Labour (16008).'
    ], src:['ILO_MW','ILO_REG']},
    {id:'domestic', em:'\uD83E\uDDF9', t:'Domestic workers (house workers)', p:[
      'Domestic workers are protected by <b>Law No. 15 of 2017</b> and the standard contract.',
      '-Minimum wage QAR 1,000 basic, plus food and housing.',
      '-Salary by the 3rd day of the next month.',
      '-Not more than 10 hours of work a day.',
      '-1 paid day off each week (24 hours in a row).',
      '-3 weeks paid leave a year. Return ticket home every 2 years.',
      '-End-of-service money: at least 3 weeks\u2019 pay per year.',
      '-Free medical care from your employer.',
      '-Your passport stays with you.',
      '-You can leave Qatar: tell your employer 72 hours before.',
      '-You can change jobs.',
      'You can make a complaint to the Ministry of Labour. See <a href="#help">Get Help Now</a>.'
    ], src:['ILO_KYR','ILO_REG','ILO_REP']},
    {id:'injury', em:'\uD83E\uDE79', t:'Injury at work', p:[
      'If you are hurt at work, your employer must pay for your treatment.',
      'You get <b>full pay</b> during treatment, for up to 6 months. After that, half pay until you recover or a disability is decided.',
      'If a worker is disabled or dies because of a work injury, the worker or the family has a right to compensation.',
      'Tell your employer about the injury in writing. Keep a copy and your medical papers.'
    ], src:['ILO_REG']}
    ]},

  help:{title:'Get Help Now', em:'\uD83C\uDD98',
    intro:'You have the right to complain. Here is how.',
    top:['mol','e999'],
    secs:[
    {id:'how', em:'\uD83D\uDCE3', t:'How to make a labour complaint', open:true, steps:[
      ['Collect your papers','Contract, Qatar ID, bank records or pay slips, photos, messages, names of co-workers who know. Keep copies on your phone.'],
      ['Contact the Ministry of Labour','Call <a href="tel:16008">16008</a> (24 hours). You can also use the online complaints platform on <a href="https://www.mol.gov.qa" target="_blank" rel="noopener">mol.gov.qa</a>, or visit a Ministry of Labour office.'],
      ['Meeting to settle','The Ministry invites you and your employer to talk and try to solve the problem. Bring your proof.'],
      ['Labour Dispute Settlement Committee','If it is not solved, the case can go to this committee. It is led by a judge. Workers do not pay court fees. Hearings are in Arabic. The committee should decide within 3 weeks from the first hearing. Either side can appeal to the Court of Appeal.'],
      ['Still not paid?','If the committee decides you must be paid and the employer does not pay, apply to the <a href="#help/wsif">Workers\u2019 Support and Insurance Fund</a>.']
    ], p:[
      '<b>Time limit:</b> complain while you still work there, or not later than <b>1 year</b> after the job ends.',
      '<b>Dismissed or punished?</b> Send a written complaint to your employer within 7 days. The employer has 7 days to answer. If you are not happy, go to the Ministry within the next 7 days.',
      'Cases can take time. Some workers change job so they have income while they wait.'
    ], src:['ILO_DR','ILO_REG','MOL_AI','ILO_REP','LAW9_CM']},
    {id:'wsif', em:'\uD83D\uDCB5', t:'Workers\u2019 Support and Insurance Fund', p:[
      'A government fund that can pay workers what they are owed when the employer does not pay.',
      'It pays mainly after a <b>final decision</b> of the Labour Dispute Settlement Committee or a court. Apply with a copy of that decision.',
      'It can also pay in some cases of late monthly wages, and other urgent cases, when the Fund decides.',
      'There is a maximum amount it can pay. The Fund then collects the money from the employer.'
    ], c:['wsif'], src:['WSIF_DEC','ILO_REG','WSIF_WEB']},
    {id:'nhrc', em:'\uD83E\uDD1D', t:'National Human Rights Committee (NHRC)', p:[
      'An official Qatar body for human rights. You can send a complaint by email, phone, fax, in person or online.',
      'Write your complaint clearly. Add your phone number and address, a copy of your passport or visa, and any papers that support it.'
    ], c:['nhrc'], src:['NHRC']},
    {id:'others', em:'\uD83E\uDDED', t:'More places to get help', p:[
      '<a href="#mol">Ministry of Labour</a> – complaints, job change, heat rules.',
      '<a href="#ilo">ILO Office</a> – can pass your problem to the Ministry.',
      '<a href="#embassies">Your embassy</a> – advice and support for your citizens.',
      '<a href="#emergency">Emergency 999</a> – danger, violence, accident.',
      '<a href="#listen">Your Voice</a> – all the ways the government listens to workers.'
    ]},
    {id:'safe', em:'\uD83D\uDEE1\uFE0F', t:'Stay safe', p:[
      '-Do not sign papers you do not understand.',
      '-Never sign a paper saying you got money that you did not get.',
      '-Take photos of your contract, ID, payslips and bank messages.',
      '-Only trust the Ministry\u2019s official website <b>mol.gov.qa</b> and its official social media <b>@MOLQTR</b>. Fake accounts exist.',
      '-Never share passwords, PIN codes or bank details with anyone.'
    ], src:['MOL_FAKE']}
    ]},

  salary:{title:'Salary late? What to do', em:'\u23F3',
    intro:'Follow these steps. Stay calm and keep proof.',
    steps:[
      ['Check the date','A monthly salary is due on the <b>1st</b> of the month. Your employer must pay it into your bank account through WPS within <b>7 days</b>. (Domestic workers: by the <b>3rd</b> of the next month.)'],
      ['Keep proof','Save your contract, Qatar ID, bank statements or SMS, pay slips, and messages. Write down dates. Take photos.'],
      ['Ask your employer politely','Ask HR or your manager, if possible in writing (message or letter). Keep a copy of what you send and what they reply.'],
      ['Complain to the Ministry of Labour','Call <a href="tel:16008">16008</a> or use the online complaints platform on <a href="https://www.mol.gov.qa" target="_blank" rel="noopener">mol.gov.qa</a>. Many workers can complain together if all are not paid.'],
      ['Go to the meeting','The Ministry will try to settle it with your employer. Bring your proof and a list of what you are owed.'],
      ['Committee (judge)','If not settled, the case can go to the Labour Dispute Settlement Committee. Workers do not pay court fees. Hearings are in Arabic, so ask for help with language (your embassy can advise).'],
      ['Workers\u2019 Support and Insurance Fund','If the committee orders payment and your employer still does not pay, apply to the Fund with the decision.'],
      ['Ask about changing job','Under the 2026 law, a worker affected by salary violations may ask to change employer or end the contract, with the employer paying the cost to go home. Ask the Ministry.'],
      ['Tell your embassy','Your embassy\u2019s labour section can advise you. See <a href="#embassies">Embassies</a>.']
    ],
    p:['<span class="note">Do not sign any paper saying you received money you did not receive. Complain while you still work there, or within 1 year after the job ends.</span>'],
    src:['WPS_2026','ILO_KYR','ILO_DR','ILO_REG','WSIF_DEC','LAW9_CM','MOL_AI']},

  mol:{title:'Ministry of Labour', em:'\uD83C\uDFDB\uFE0F',
    intro:'The Ministry of Labour (MoL) is the Qatar government office for work and workers.',
    top:['mol'],
    secs:[
    {id:'what', em:'\u2705', t:'What the Ministry can help with', open:true, p:[
      '-Receives <b>labour complaints</b> (salary, end-of-service money, leave, housing, passport, fees) and tries to settle them with the employer.',
      '-Sends cases that are not settled to the <b>Labour Dispute Settlement Committees</b>.',
      '-Runs the <b>Wage Protection System</b>. Companies that do not pay can be blocked.',
      '-Handles <b>job change</b> requests and notices on its online platform.',
      '-Checks workplaces, including <b>summer heat rules</b>. It can close work sites that break the rules.',
      '-Approves (authenticates) employment contracts, in Arabic and another language.',
      '-Under the 2026 law it can stop a company\u2019s services with the Ministry and publish names of repeat violators.'
    ], src:['ILO_REG','ILO_REP','HEAT_3','LAW9_CM','LAW9_QNA']},
    {id:'contact', em:'\u260E\uFE0F', t:'How to contact the Ministry', open:true, p:[
      '<b>Hotline 16008</b> – for complaints and questions. Open 24 hours. You can report violations without giving your name.',
      '<b>Online complaints platform</b> – the Ministry\u2019s \u201CUnified Platform for Complaints and Whistleblowers\u201D. Find it on mol.gov.qa. You can file a complaint and follow it there.',
      '<b>In person</b> – visit a Ministry of Labour office. Take your Qatar ID and contract.',
      '<b>Official social media:</b> @MOLQTR. Beware of fake accounts.'
    ], c:['mol'], src:['MOL_AI','ILO_DR','ILO_REG','MOL_FAKE','MOL_WEB']},
    {id:'wa', em:'\uD83D\uDCAC', t:'WhatsApp information service', p:[
      '<span class="tag">Check</span> In 2021 the government started an automatic WhatsApp service about labour law: send \u201CHi\u201D to +974 6006 0601. It had information on rights and complaints in several languages.',
      'We could not confirm it still works in 2026. Check with the Ministry.'
    ], c:['molwa'], src:['GCO_WA']},
    {id:'more', em:'\u27A1\uFE0F', t:'More from the Ministry', p:[
      '<a href="#change">Change Jobs</a> – step-by-step guide.',
      '<a href="#listen">Your Voice</a> – how the government listens to workers.',
      '<a href="#campaigns">Campaigns</a> – heat safety, know your rights, visa centres.'
    ]}
    ]},

  ilo:{title:'ILO Office in Qatar', em:'\uD83C\uDF10',
    intro:'The International Labour Organization (ILO) is the United Nations agency for work. Qatar has been a member since 1972.',
    top:['ilo'],
    secs:[
    {id:'what', em:'\uD83C\uDFE2', t:'What the ILO office does', open:true, p:[
      'The <b>ILO Project Office for the State of Qatar</b> works with the Government of Qatar on labour reforms. This is a technical cooperation programme. Phase 3 runs from 2024 to 2028.',
      'The programme supported reforms such as the minimum wage, heat stress rules, wage protection, and ending the NOC and exit permit rules.',
      'The ILO office and its partners <b>receive questions from workers and refer (pass) them to the Ministry of Labour for action</b>. Most questions are about unpaid wages, end-of-service money and changing employer.',

STR.en.pages.change = {title:'Change Jobs', em:'\uD83D\uDD04',
  intro:'You can change your job in Qatar. You do <b>not</b> need your employer\u2019s permission (no NOC). Here is how.',
  secs:[
  {id:'who', em:'\uD83D\uDC64', t:'Who can change job?', open:true, p:[
    'All workers can change job at any time during the contract, <b>without a No Objection Certificate (NOC)</b>.',
    'This includes private sector workers, domestic workers, and farm and fishing workers.',
    '-Your Qatar ID (residence permit) must be valid, or it ended less than <b>90 days</b> ago.',
    '-You need a Qatar mobile number <b>in your own name</b>, linked to your Qatar ID.'
  ], src:['MOL_CE','ILO_REG','PEN_CE']},
  {id:'steps', em:'\uD83D\uDC63', t:'Step by step', open:true, steps:[
    ['Find a new job','Get a clear job offer. Check the pay, job title, contract length, probation, food and housing.'],
    ['The request goes online','The request is made only on the Ministry of Labour website <a href="https://www.mol.gov.qa" target="_blank" rel="noopener">mol.gov.qa</a>, service \u201CChange of employer within the labour market\u201D. Usually the new employer starts it and enters the new contract details. You can also start it yourself.'],
    ['Check and approve within 3 days','You get an SMS. Log in to the \u201CLabors and Individuals\u201D portal, open \u201CMy Requests\u201D, choose the request, press \u201CTake Action\u201D, check all details, then press \u201CApprove\u201D. You have <b>3 days</b>. If you do nothing, the request is rejected automatically.'],
    ['Your employer is told','Your current employer gets a message. They can add a comment for the Ministry, but they do <b>not</b> have to agree.'],
    ['The Ministry approves','You get an SMS with the last day of your notice period. Keep the request number and the SMS.'],
    ['Work your notice period','Keep working for your current employer until the notice ends, unless your employer agrees to shorten it.'],
    ['New contract and new Qatar ID','Within 3 months after the notice ends, the new employer registers your new contract with the Ministry and asks for your new Qatar ID. They must give you a copy of the contract and your new ID.']
  ], src:['PEN_CE','ILO_REP','MOL_CE']},
  {id:'notice', em:'\u23F3', t:'Notice period', p:[
    '-Worked <b>2 years or less</b> with this employer: <b>1 month</b> notice.',
    '-Worked <b>more than 2 years</b>: <b>2 months</b> notice.',
    '-During <b>probation</b>: apply at least <b>1 month</b> before you leave.',
    'Your employer can agree to shorten or cancel the notice. If you both agree, choose \u201CYes\u201D for this in the request. Get it in writing too.',
    'Leave before the notice ends? You must pay your employer your basic pay for the days you do not work. Example: basic pay QAR 1,500 a month, you leave 2 weeks early = you pay QAR 750.',
    '<b>Salary not paid?</b> If your employer did not keep to the law (for example, did not pay your salary), you can change job without notice. Make a complaint to the Ministry of Labour.'
  ], src:['MOL_CE','PEN_CE','LAW9_CM']},
  {id:'probation', em:'\uD83D\uDD0D', t:'During probation', p:[
    '-Probation is at most <b>6 months</b> (domestic workers: at most <b>3 months</b>). Only one probation with the same employer.',
    '-You can still change job. Apply at least 1 month before you leave.',
    '-The <b>new employer</b> (not you) pays your old employer part of the recruitment cost and air ticket. This is not more than 2 months of your basic pay.'
  ], src:['MOL_CE','ILO_REG']},
  {id:'fees', em:'\uD83D\uDCB8', t:'Fees and how long it takes', p:[
    '-Changing employer is <b>free</b> for workers.',
    '-You do not pay your new employer for your new Qatar ID.',
    '-No fixed time is published. The ILO reported that in September 2024 the Ministry took <b>9 days</b> on average to process a request. Check with the Ministry.',
    '-Worked 1 year or more? Your old employer must pay your end-of-service money and any leave money due.'
  ], src:['MOL_CE','ILO_MOB','ILO_REP']},
  {id:'refuse', em:'\uD83D\uDEE1\uFE0F', t:'If your employer says no, or files an absconding case', p:[
    '-Your employer does <b>not</b> need to agree. There is no NOC.',
    '-After you submit your job change request, your employer <b>cannot cancel your Qatar ID</b> or file a false absconding (\u201Crunaway\u201D) case.',
    '-If you already have a labour complaint or a job change request, an absconding report can only be filed after it is looked at and resolved.',
    '-A false, malicious absconding report can be punished.',
    '<b>Employer blocking you?</b> Call <a href="tel:16008">16008</a>, complain on the Ministry\u2019s \u201CUnified Platform for Complaints and Whistleblowers\u201D, email <a href="mailto:info@mol.gov.qa">info@mol.gov.qa</a>, or visit a Ministry of Labour office.',
    '<b>Qatar ID cancelled before you applied?</b> First make a complaint to the Ministry. Then give a signed letter in Arabic to the Head of the Labour Relations Department, asking to reactivate your ID. Add a copy of your Qatar ID, the SMS about the cancellation, and your new job offer. Keep copies.',
    'Tell your embassy too. See <a href="#embassies">Embassies</a>.'
  ], src:['MOL_CE','ILO_REG']},
  {id:'tips', em:'\uD83D\uDCA1', t:'Good to know', p:[
    '-Do not leave Qatar without giving notice. You may not be able to come back to work in Qatar for 1 year.',
    '-You can cancel your request while it is still under review.',
    '-Only use the official website <b>mol.gov.qa</b>. The Ministry does not charge workers for changing job.',
    '-Domestic workers follow the same rules (probation up to 3 months).'
  ], src:['MOL_CE','MOL_FAKE']}
  ]};

STR.en.pages.listen = {title:'Your Voice: how the government listens', em:'\uD83D\uDDE3\uFE0F',
  intro:'Qatar has many ways for workers to be heard: to ask a question, report a problem, or share ideas.',
  secs:[
  {id:'hotline', em:'\u260E\uFE0F', t:'Ministry of Labour hotline and online platform', open:true, p:[
    '<b>Hotline <a href="tel:16008">16008</a></b>, open 24 hours. You can report a problem <b>without giving your name</b>.',
    'The Ministry\u2019s online <b>\u201CUnified Platform for Complaints and Whistleblowers\u201D</b> takes complaints, and reports about companies breaking the law.',
    'Most complaints are solved by talking with the employer. From January to September 2024 the platform received 22,158 complaints. About 73% were settled at the Ministry.',
    'From January to March 2026 the Ministry registered 5,369 worker complaints and settled 2,797 of them in those 3 months. It also received 486 reports from the public.'
  ], src:['MOL_AI','MOL_CE','ILO_REP','PEN_Q1']},
  {id:'jc', em:'\uD83E\uDD1D', t:'Joint Committees: workers and managers together', p:[
    'A Joint Committee is a group in a company where <b>worker representatives chosen by the workers</b> and managers meet to talk about problems at work and solve them.',
    'The Ministry and the ILO set up 73 pilot joint committees in companies from 2019 to 2023.',
    '<b>New law (Law No. 9 of 2026):</b> companies with <b>100 or more workers</b> must have a joint committee. Detailed rules will come in a Ministry decision. Check with the Ministry.',
    'Ask your HR if your company has a joint committee, and who your worker representatives are.'
  ], src:['ILO_REP','LAW9_CM']},
  {id:'ldsc', em:'\u2696\uFE0F', t:'Labour Dispute Settlement Committees', p:[
    'If a complaint is not settled, a committee led by a judge decides. Workers do not pay court fees.',
    'Under Law No. 9 of 2026 the committees can also hold hearings online (electronically).',
    'From January to March 2026 the committees issued 2,228 decisions.'
  ], src:['ILO_DR','LAW9_CM','PEN_Q1']},
  {id:'wsif', em:'\uD83D\uDCB5', t:'Workers\u2019 Support and Insurance Fund', p:[
    'Pays workers what they are owed when the employer does not pay after a committee decision. See <a href="#help/wsif">Get Help Now</a>.',
    'The Fund and the Ministry also meet migrant community leaders to hear workers\u2019 problems.'
  ], src:['WSIF_DEC','ILO_REP','BWI_CLF']},
  {id:'nhrc', em:'\uD83C\uDFDB\uFE0F', t:'National Human Rights Committee (NHRC)', p:[
    'Takes complaints from workers. Hotline <a href="tel:8002222">8002222</a>.',
    'Runs a yearly workers\u2019 awareness campaign around International Labour Day (1 May).',
    'Holds workshops for domestic workers, where they can talk with officials, for example from the Ministry of Labour.'
  ], c:['nhrc'], src:['NHRC','QNA_LD25','GT_NHRC']},
  {id:'community', em:'\uD83D\uDC65', t:'Community leaders and forums', p:[
    'The Ministry and the Fund meet leaders of migrant communities. The leaders pass workers\u2019 feedback to the Ministry.',
    'Community leaders get training on Qatar\u2019s labour law (4 sessions in 2024, under an agreement between the Ministry and Migrant Forum Asia).',
    'In October 2024, about 300 community representatives from 19 nationalities met the Ministry and the Fund at a Community Leaders\u2019 Forum in Doha, with BWI (a global union).',
    'Community groups also hold rights sessions with Ministry support, for example in August 2025 at the Ministry of Labour training room.'
  ], src:['ILO_REP','BWI_CLF','GT_BMKQ']},
  {id:'ilo', em:'\uD83C\uDF10', t:'ILO and union helpers pass on your questions', p:[
    'The ILO office, community liaison officers of international trade unions, and community leaders receive workers\u2019 questions and <b>refer them to the Ministry of Labour</b> for action.',
    'Contact the ILO: see <a href="#ilo">ILO Office</a>.'
  ], src:['ILO_REP']},
  {id:'sc', em:'\u26BD', t:'World Cup legacy: Workers\u2019 Welfare Forums', p:[
    'For FIFA World Cup 2022 projects, the Supreme Committee for Delivery & Legacy\u2019s <b>Workers\u2019 Welfare Standards</b> required a Workers\u2019 Welfare Forum at each workers\u2019 accommodation site.',
    'Workers elected representatives (one per nationality). The forum met at least once a month, and workers could raise concerns without fear of punishment.'
  ], src:['SC_WWS']}
  ]};

STR.en.pages.campaigns = {title:'Campaigns and awareness', em:'\uD83D\uDCE2',
  intro:'The Ministry of Labour and its partners run campaigns to help workers know their rights and stay safe.',
  secs:[
  {id:'heat26', em:'\u2600\uFE0F', t:'Heat Stress Prevention Campaign 2026', open:true, p:[
    'Ran from <b>1 June to 15 September 2026</b>, led by the Ministry\u2019s Occupational Safety and Health Department.',
    'Partners included the Ministry of Public Health, the Workers\u2019 Support and Insurance Fund, the Ministry of Education and Higher Education, the Public Works Authority, Qatar Red Crescent, and delivery companies Snoonu, Talabat, Rafeeq and Keeta.',
    '-Guidance materials in many languages.',
    '-Seminars and training for workers and employers.',
    '-Inspections: <b>388 work sites were closed</b> (for 3 days each) for breaking the midday work ban.',
    'The Ministry says inspection and awareness continue all year. See <a href="#rights/heat">Summer heat protection</a>.'
  ], src:['HEAT_2','PEN_HEATEND','QNA_388']},
  {id:'heatsigns', em:'\uD83E\uDD75', t:'What heat campaigns teach', p:[
    '<b>Signs of heat stress:</b> dizziness, headache, a lot of sweating (or no sweating), tiredness, fainting.',
    '<b>What to do:</b> stop work, go to the shade, drink water, and get medical help if needed. Emergency: <a href="tel:999">999</a>.',
    '<b>Prevent it:</b> drink water often, rest in the shade, wear light clothes and head protection outdoors.'
  ], src:['QNA_HEAT25']},
  {id:'heatpast', em:'\uD83D\uDCC6', t:'Earlier heat campaigns', p:[
    '-<b>2025:</b> nationwide campaign with the Ministry of Public Health and the Fund. On 21 June 2025 a field campaign in Asian Town gave workers printed materials in many languages.',
    '-<b>2024:</b> targeted inspections; 368 work sites were shut down for breaking the rules.',
    '-<b>2024:</b> a joint heat campaign by BWI (a global union) and the Ministry reached more than 2,824 workers in 25 companies and communities.'
  ], src:['QNA_HEAT25','PEN_HEAT25','ILO_REP','BWI_CLF']},
  {id:'safety', em:'\u26D1\uFE0F', t:'Safety checks and seminars', p:[
    'From January to March 2026 the Ministry\u2019s Occupational Safety and Health Department ran <b>355 awareness programmes</b>, visited 5,918 workplaces and made 2,322 visits to workers\u2019 accommodation.',
    'In January 2026 it held construction safety seminars for workers with companies, the Ministry of Public Health and the Fund.'
  ], src:['PEN_Q1','PEN_SEM26']},
  {id:'kyr', em:'\uD83D\uDCD8', t:'Know your rights: guides in many languages', p:[
    '-<b>\u201CKnow Your Rights\u201D</b> booklet for domestic workers (ILO) in 12 languages: Arabic, Bahasa, Bengali, English, Hindi, Malayalam, Nepali, Sinhala, Swahili, Tagalog, Telugu and Urdu.',
    '-The NHRC gives domestic workers a booklet on their rights and duties in 11 languages (June 2025).',
    '-The NHRC\u2019s 2025 Labour Day campaign was called <b>\u201CLegal aid: your voice is heard, your rights are protected\u201D</b>, with the Ministry of Labour, the Fund, the ILO and IOM.',

  ], src:['ILO_REP','ILO_KYR','GT_NHRC','QNA_LD25']},
  {id:'qvc', em:'\uD83D\uDEC2', t:'Qatar Visa Centres in home countries', p:[
    'Before you travel, you can <b>read and sign your exact contract</b>, give fingerprints and do medical tests at a Qatar Visa Centre in your country. You also get information about your rights and life in Qatar.',
    'The services are <b>free for workers</b>. The employer pays.',
    'If the contract is not what you were promised, you can think again before you travel.',
    'Centres (July 2024): India (New Delhi, Mumbai, Kolkata, Lucknow, Hyderabad, Chennai, Kochi), Pakistan (Islamabad, Karachi), Bangladesh (Dhaka, Sylhet), Nepal (Kathmandu), Philippines (Manila), Sri Lanka (Colombo). Centres in Kenya, Indonesia and Tunisia were planned.'
  ], src:['ILO_QVC','GT_QVC']},
  {id:'events', em:'\uD83C\uDF89', t:'Workers\u2019 Day and community events', p:[
    '-<b>1 May 2025:</b> NHRC seminar on workers\u2019 rights for International Labour Day, with the Ministry of Labour, the Fund, the ILO and IOM.',
    '-<b>May 2024:</b> Labour Day outing for workers at the 3-2-1 Qatar Olympic and Sports Museum (ILO and the Fund).',
    '-<b>November 2024:</b> road safety awareness event for more than 300 delivery riders and drivers, with the Embassy of Ghana, the Fund, the Ministry of Labour, the Ministry of Interior and the ILO.'
  ], src:['QNA_LD25','ILO_REP']},
  {id:'official', em:'\u2705', t:'Follow official channels only', p:[
    'The Ministry\u2019s official website is <b>mol.gov.qa</b> and its official social media name is <b>@MOLQTR</b>. The Ministry has warned about fake accounts.'
  ], src:['MOL_FAKE']}
  ]};

    {t:'न्यूनतम सैलरी (मिनिमम वेज)', p:[

    {t:'सैलरी समय पर', p:[
      'मालिक को आपकी सैलरी क़तर के आपके बैंक खाते में डालनी होगी। इसे <b>Wage Protection System (WPS)</b> कहते हैं।',

    {t:'नौकरी बदलना', p:[

    {t:'सुरक्षित रहने की जगह और खाना', p:[
      'अगर मालिक रहने की जगह देता है, तो वह सरकारी नियमों (Ministerial Decision No. 18 of 2014) के हिसाब से होनी चाहिए।',
      'हर मज़दूर के पास अपना लॉकर होना चाहिए, जिसे कभी भी बंद और खोल सकें।',
      'अगर मालिक खाना देता है: <b>दिन में 3 बार खाना</b>, अच्छा, पेट भर, और आपके रहन-सहन के हिसाब से।',
      'रहने की जगह खराब या खतरनाक है? लेबर मंत्रालय (16008) को बताएँ।'
    ]},
    {t:'घरेलू कामगार (घर में काम करने वाले)', p:[
      'घरेलू कामगारों की सुरक्षा <b>Law No. 15 of 2017</b> और स्टैंडर्ड कॉन्ट्रैक्ट से होती है।',
      '-न्यूनतम सैलरी QAR 1,000 बेसिक, साथ में खाना और रहने की जगह।',
      '-सैलरी अगले महीने की 3 तारीख तक।',
      '-दिन में 10 घंटे से ज़्यादा काम नहीं।',
      '-हर हफ़्ते 1 दिन की पेड छुट्टी (लगातार 24 घंटे)।',
      '-साल में 3 हफ़्ते की पेड छुट्टी। हर 2 साल में घर जाने का टिकट।',
      '-ग्रेच्युटी: हर साल के लिए कम से कम 3 हफ़्ते का पैसा।',
      '-मालिक की तरफ़ से मुफ़्त इलाज।',
      '-आपका पासपोर्ट आपके पास रहेगा।',
      '-आप क़तर छोड़ सकते हैं: मालिक को 72 घंटे पहले बताएँ।',
      '-आप नौकरी बदल सकते हैं।',
      'आप लेबर मंत्रालय में शिकायत कर सकते हैं। देखें <a href="#help">अभी मदद लें</a>।'
    ]},
    {t:'काम पर चोट', p:[
      'अगर काम पर चोट लगे, तो इलाज का खर्च मालिक देगा।',
      'इलाज के दौरान 6 महीने तक <b>पूरी सैलरी</b> मिलती है। उसके बाद आधी सैलरी, जब तक आप ठीक न हों या विकलांगता तय न हो।',
      'अगर काम की चोट से मज़दूर विकलांग हो जाए या उसकी मौत हो जाए, तो मज़दूर या परिवार को मुआवज़े का हक है।',
      'चोट के बारे में मालिक को लिखकर बताएँ। उसकी कॉपी और डॉक्टर के कागज़ संभालकर रखें।'
    ]}
  ]},
  help:{title:'अभी मदद लें', intro:'आपको शिकायत करने का हक है। ऐसे करें।', secs:[
    {t:'लेबर शिकायत कैसे करें', steps:[
      ['अपने कागज़ इकट्ठा करें','कॉन्ट्रैक्ट, क़तर ID, बैंक का हिसाब या सैलरी स्लिप, फ़ोटो, मैसेज, और उन साथियों के नाम जो बात जानते हैं। सबकी कॉपी फ़ोन में रखें।'],
      ['लेबर मंत्रालय से संपर्क करें','<a href="tel:16008">16008</a> पर कॉल करें (24 घंटे)। आप <a href="https://www.mol.gov.qa" target="_blank" rel="noopener">mol.gov.qa</a> पर ऑनलाइन शिकायत भी कर सकते हैं, या लेबर मंत्रालय के दफ़्तर जा सकते हैं।'],
      ['सुलह की मीटिंग','मंत्रालय आपको और मालिक को बात करने और मामला सुलझाने के लिए बुलाता है। अपने सबूत साथ ले जाएँ।'],
      ['Labour Dispute Settlement Committee (लेबर झगड़ा निपटाने वाली कमेटी)','अगर मामला नहीं सुलझा, तो केस इस कमेटी में जा सकता है। इसे एक जज चलाते हैं। मज़दूरों को कोर्ट की फ़ीस नहीं देनी पड़ती। सुनवाई अरबी में होती है। कमेटी को पहली सुनवाई से 3 हफ़्ते में फ़ैसला करना चाहिए। कोई भी पक्ष ऊपर की अदालत (Court of Appeal) में अपील कर सकता है।'],
      ['फिर भी पैसा नहीं मिला?','अगर कमेटी कहे कि आपको पैसा मिलना चाहिए और मालिक न दे, तो <a href="#help/wsif">Workers\u2019 Support and Insurance Fund (मज़दूर सहायता फ़ंड)</a> में अर्ज़ी दें।']
    ], p:[
      '<b>समय सीमा:</b> जब तक आप वहाँ काम कर रहे हैं तब शिकायत करें, या नौकरी खत्म होने के <b>1 साल</b> के अंदर।',
      '<b>नौकरी से निकाला या सज़ा दी?</b> 7 दिन के अंदर मालिक को लिखकर शिकायत दें। मालिक के पास जवाब देने के लिए 7 दिन हैं। जवाब से खुश नहीं हैं, तो अगले 7 दिन में मंत्रालय जाएँ।',
      'केस में समय लग सकता है। कुछ मज़दूर इंतज़ार के दौरान नौकरी बदल लेते हैं ताकि कमाई चलती रहे।'
    ]},
    {t:'Workers\u2019 Support and Insurance Fund (मज़दूर सहायता फ़ंड)', p:[
      'सरकारी फ़ंड, जो मालिक के पैसा न देने पर मज़दूरों का बकाया दे सकता है।',
      'यह ज़्यादातर Labour Dispute Settlement Committee या कोर्ट के <b>आखिरी फ़ैसले</b> के बाद पैसा देता है। उस फ़ैसले की कॉपी के साथ अर्ज़ी दें।',
      'फ़ंड चाहे तो कुछ मामलों में देर से मिलने वाली महीने की सैलरी और दूसरे ज़रूरी मामलों में भी पैसा दे सकता है।',
      'फ़ंड एक तय रकम तक ही पैसा देता है। फिर फ़ंड वह पैसा मालिक से वसूलता है।'
    ]},
    {t:'National Human Rights Committee (NHRC, राष्ट्रीय मानव अधिकार कमेटी)', p:[
      'क़तर की सरकारी मानव अधिकार संस्था। आप ईमेल, फ़ोन, फ़ैक्स, खुद जाकर या ऑनलाइन शिकायत भेज सकते हैं।',
      'अपनी शिकायत साफ़-साफ़ लिखें। अपना फ़ोन नंबर और पता, पासपोर्ट या वीज़ा की कॉपी, और जो भी कागज़ हों, साथ में लगाएँ।'
    ]},
    {t:'मदद की और जगहें', p:[
      '<a href="#mol">लेबर मंत्रालय</a> – शिकायत, नौकरी बदलना, गर्मी के नियम।',
      '<a href="#ilo">ILO दफ़्तर</a> – आपकी समस्या मंत्रालय तक पहुँचा सकता है।',
      '<a href="#embassies">आपका दूतावास</a> – अपने देश के लोगों को सलाह और मदद।',
      '<a href="#emergency">इमरजेंसी 999</a> – खतरा, मारपीट, दुर्घटना।'
    ]},
    {t:'सावधान रहें', p:[
      '-जो कागज़ समझ न आए, उस पर साइन न करें।',
      '-ऐसे कागज़ पर कभी साइन न करें जिसमें लिखा हो कि आपको पैसा मिल गया, जब मिला न हो।',
      '-अपने कॉन्ट्रैक्ट, ID, सैलरी स्लिप और बैंक के मैसेज की फ़ोटो रखें।',
      '-सिर्फ मंत्रालय की असली वेबसाइट <b>mol.gov.qa</b> और असली सोशल मीडिया <b>@MOLQTR</b> पर भरोसा करें। नकली अकाउंट भी हैं।',
      '-पासवर्ड, PIN या बैंक की जानकारी किसी को न दें।'
    ]}
  ]},
  salary:{title:'सैलरी देर से? क्या करें', intro:'ये कदम उठाएँ। शांत रहें और सबूत संभालकर रखें।', steps:[
      ['तारीख देखें','महीने की सैलरी <b>1</b> तारीख को बनती है। मालिक को WPS से <b>7 दिन</b> के अंदर आपके बैंक खाते में डालनी होगी। (घरेलू कामगार: अगले महीने की <b>3</b> तारीख तक।)'],
      ['सबूत रखें','कॉन्ट्रैक्ट, क़तर ID, बैंक स्टेटमेंट या SMS, सैलरी स्लिप और मैसेज संभालकर रखें। तारीखें लिख लें। फ़ोटो लें।'],
      ['मालिक से आराम से पूछें','HR या मैनेजर से पूछें, हो सके तो लिखकर (मैसेज या चिट्ठी)। जो भेजा और जो जवाब आया, उसकी कॉपी रखें।'],
      ['लेबर मंत्रालय में शिकायत करें','<a href="tel:16008">16008</a> पर कॉल करें या <a href="https://www.mol.gov.qa" target="_blank" rel="noopener">mol.gov.qa</a> पर ऑनलाइन शिकायत करें। अगर कई लोगों को पैसा नहीं मिला, तो सब साथ मिलकर शिकायत कर सकते हैं।'],
      ['मीटिंग में जाएँ','मंत्रालय मालिक के साथ मामला सुलझाने की कोशिश करेगा। सबूत और बकाया पैसे की लिस्ट ले जाएँ।'],
      ['कमेटी (जज)','अगर मामला नहीं सुलझा, तो केस Labour Dispute Settlement Committee में जा सकता है। मज़दूरों को कोर्ट की फ़ीस नहीं देनी पड़ती। सुनवाई अरबी में होती है, इसलिए भाषा में मदद माँगें (आपका दूतावास सलाह दे सकता है)।'],
      ['Workers\u2019 Support and Insurance Fund (मज़दूर सहायता फ़ंड)','अगर कमेटी पैसा देने का आदेश दे और मालिक फिर भी न दे, तो फ़ैसले के साथ फ़ंड में अर्ज़ी दें।'],
      ['नौकरी बदलने के बारे में पूछें','2026 के कानून में, जिस मज़दूर की सैलरी के नियम टूटे हों, वह मालिक बदलने या कॉन्ट्रैक्ट खत्म करने की माँग कर सकता है, और घर जाने का खर्च मालिक देगा। मंत्रालय से पूछें।'],
      ['अपने दूतावास को बताएँ','आपके दूतावास का लेबर विभाग सलाह दे सकता है। देखें <a href="#embassies">दूतावास</a>।']
    ],
    p:['<span class="note">ऐसे किसी कागज़ पर साइन न करें जिसमें लिखा हो कि आपको पैसा मिल गया, जब मिला न हो। शिकायत तब करें जब आप वहाँ काम कर रहे हों, या नौकरी खत्म होने के 1 साल के अंदर।</span>']},
  mol:{title:'लेबर मंत्रालय (Ministry of Labour)', intro:'लेबर मंत्रालय (MoL) क़तर सरकार का वह दफ़्तर है जो काम और मज़दूरों का ध्यान रखता है।', secs:[
    {t:'मंत्रालय किसमें मदद कर सकता है', p:[
      '-<b>लेबर शिकायतें</b> लेता है (सैलरी, ग्रेच्युटी, छुट्टी, रहने की जगह, पासपोर्ट, फ़ीस) और मालिक से बात करके सुलझाने की कोशिश करता है।',
      '-जो मामले नहीं सुलझते, उन्हें <b>Labour Dispute Settlement Committees</b> (लेबर कमेटी) में भेजता है।',
      '-<b>Wage Protection System</b> (सैलरी सिस्टम) चलाता है। पैसा न देने वाली कंपनियों को रोका जा सकता है।',
      '-अपने ऑनलाइन सिस्टम पर <b>नौकरी बदलने</b> की अर्ज़ी और नोटिस देखता है।',
      '-काम की जगहों की जाँच करता है, <b>गर्मी के नियम</b> भी। नियम तोड़ने वाली साइट बंद कर सकता है।',
      '-काम के कॉन्ट्रैक्ट को मंज़ूरी देता है, अरबी और एक दूसरी भाषा में।',
      '-2026 के कानून के तहत यह कंपनी की मंत्रालय वाली सेवाएँ रोक सकता है और बार-बार नियम तोड़ने वालों के नाम छाप सकता है।'
    ]},
    {t:'मंत्रालय से कैसे संपर्क करें', p:[
      '<b>हेल्पलाइन 16008</b> – शिकायत और सवालों के लिए। 24 घंटे खुली। आप अपना नाम बताए बिना भी गलत काम की खबर दे सकते हैं।',
      '<b>ऑनलाइन शिकायत</b> – मंत्रालय का \u201CUnified Platform for Complaints and Whistleblowers\u201D। यह mol.gov.qa पर मिलेगा। वहाँ शिकायत कर सकते हैं और उसका हाल देख सकते हैं।',
      '<b>खुद जाकर</b> – लेबर मंत्रालय के दफ़्तर जाएँ। क़तर ID और कॉन्ट्रैक्ट साथ ले जाएँ।',
      '<b>असली सोशल मीडिया:</b> @MOLQTR। नकली अकाउंट से सावधान।'
    ]},
    {t:'WhatsApp जानकारी सेवा', p:[
      '<span class="tag">जाँचें</span> 2021 में सरकार ने लेबर कानून पर एक ऑटोमैटिक WhatsApp सेवा शुरू की थी: +974 6006 0601 पर \u201CHi\u201D भेजें। इसमें कई भाषाओं में अधिकारों और शिकायत की जानकारी थी।',
      'हम पक्का नहीं कर पाए कि यह 2026 में भी चलती है। मंत्रालय से पूछें।'
    ]}
  ]},
  ilo:{title:'क़तर में ILO दफ़्तर', intro:'International Labour Organization (ILO, अंतरराष्ट्रीय श्रम संगठन) काम से जुड़ी संयुक्त राष्ट्र (UN) की संस्था है। क़तर 1972 से इसका सदस्य है।', secs:[
    {t:'ILO दफ़्तर क्या करता है', p:[
      '<b>ILO Project Office for the State of Qatar</b> क़तर सरकार के साथ लेबर सुधारों पर काम करता है। यह एक तकनीकी सहयोग कार्यक्रम है। इसका तीसरा चरण (Phase 3) 2024 से 2028 तक है।',
      'इस कार्यक्रम ने न्यूनतम सैलरी, गर्मी के नियम, सैलरी सुरक्षा, और NOC व एग्ज़िट परमिट के नियम खत्म करने जैसे सुधारों में मदद की।',
      'ILO दफ़्तर और उसके साथी <b>मज़दूरों के सवाल लेते हैं और उन्हें कार्रवाई के लिए लेबर मंत्रालय को भेजते हैं</b>। ज़्यादातर सवाल बकाया सैलरी, ग्रेच्युटी और मालिक बदलने के बारे में होते हैं।',
      'यह मज़दूरों के लिए जानकारी भी देता है, जैसे घरेलू कामगारों के लिए \u201CKnow Your Rights\u201D किताब (12 भाषाओं में)।'
    ]},
    {t:'ILO दफ़्तर क्या नहीं है', p:[
      '-यह <b>अदालत नहीं है</b> और मंत्रालय भी नहीं। यह आपके केस का फ़ैसला नहीं कर सकता।',
      '-यह मालिक को पैसा देने का आदेश नहीं दे सकता, न वीज़ा या नौकरी दे सकता है।',
      '-सरकारी शिकायत के लिए <a href="#mol">लेबर मंत्रालय</a> (16008) का इस्तेमाल करें। आप दोनों कर सकते हैं।'

TR.hi.pages.change={title:'नौकरी बदलें', intro:'आप क़तर में अपनी नौकरी बदल सकते हैं। इसके लिए मालिक की इजाज़त (NOC) <b>नहीं</b> चाहिए। ऐसे करें।', secs:[
  {t:'कौन नौकरी बदल सकता है?', p:[
    'हर मज़दूर कॉन्ट्रैक्ट के दौरान कभी भी नौकरी बदल सकता है, <b>NOC (No Objection Certificate) के बिना</b>।',
    'इसमें प्राइवेट कंपनी के मज़दूर, घरेलू कामगार, और खेती व मछली पकड़ने वाले मज़दूर भी शामिल हैं।',
    '-आपकी क़तर ID (रेज़िडेंस परमिट) वैध होनी चाहिए, या उसे खत्म हुए <b>90 दिन</b> से कम हुए हों।',
    '-आपके पास क़तर का मोबाइल नंबर होना चाहिए जो <b>आपके अपने नाम</b> पर हो और आपकी क़तर ID से जुड़ा हो।'
  ]},
  {t:'एक-एक कदम', steps:[
    ['नई नौकरी ढूँढें','नौकरी का साफ़ ऑफ़र लें। सैलरी, पद, कॉन्ट्रैक्ट कितने समय का है, प्रोबेशन, खाना और रहने की जगह – सब देखें।'],
    ['आवेदन ऑनलाइन होता है','आवेदन सिर्फ़ लेबर मंत्रालय की वेबसाइट <a href="https://www.mol.gov.qa" target="_blank" rel="noopener">mol.gov.qa</a> पर होता है, सर्विस का नाम है “Change of employer within the labour market”। आमतौर पर नया मालिक आवेदन शुरू करता है और नए कॉन्ट्रैक्ट की जानकारी भरता है। आप खुद भी शुरू कर सकते हैं।'],
    ['3 दिन के अंदर जाँचें और मंज़ूर करें','आपको SMS आएगा। “Labors and Individuals” पोर्टल में लॉग-इन करें, “My Requests” खोलें, आवेदन चुनें, “Take Action” दबाएँ, सारी जानकारी जाँचें, फिर “Approve” दबाएँ। आपके पास <b>3 दिन</b> हैं। कुछ नहीं किया तो आवेदन अपने-आप रद्द हो जाएगा।'],
    ['मालिक को बताया जाता है','आपके अभी के मालिक को मैसेज जाता है। वह मंत्रालय के लिए अपनी बात लिख सकता है, लेकिन उसकी मंज़ूरी ज़रूरी <b>नहीं</b> है।'],
    ['मंत्रालय मंज़ूरी देता है','आपको SMS आएगा जिसमें नोटिस का आखिरी दिन लिखा होगा। आवेदन नंबर और SMS संभालकर रखें।'],
    ['नोटिस का समय पूरा करें','नोटिस खत्म होने तक अभी के मालिक के पास काम करते रहें, जब तक मालिक नोटिस कम करने को राज़ी न हो।'],
    ['नया कॉन्ट्रैक्ट और नई क़तर ID','नोटिस खत्म होने के 3 महीने के अंदर नया मालिक आपका नया कॉन्ट्रैक्ट मंत्रालय में दर्ज करता है और आपकी नई क़तर ID के लिए आवेदन करता है। उसे आपको कॉन्ट्रैक्ट की कॉपी और नई ID देनी होगी।']
  ]},
  {t:'नोटिस का समय', p:[
    '-इस मालिक के पास <b>2 साल या कम</b> काम किया: <b>1 महीने</b> का नोटिस।',
    '-<b>2 साल से ज़्यादा</b> काम किया: <b>2 महीने</b> का नोटिस।',
    '-<b>प्रोबेशन</b> में: छोड़ने से कम से कम <b>1 महीना</b> पहले आवेदन करें।',
    'मालिक नोटिस कम या खत्म करने को राज़ी हो सकता है। अगर आप दोनों राज़ी हैं, तो आवेदन में इसके लिए “Yes” चुनें। यह लिखकर भी ले लें।',
    'नोटिस खत्म होने से पहले छोड़ना है? जितने दिन काम नहीं करेंगे, उतने दिन की बेसिक सैलरी मालिक को देनी होगी। उदाहरण: बेसिक सैलरी QAR 1,500 महीना, 2 हफ़्ते पहले छोड़ा = आप QAR 750 देंगे।',
    '<b>सैलरी नहीं मिली?</b> अगर मालिक ने कानून नहीं माना (जैसे सैलरी नहीं दी), तो आप बिना नोटिस के नौकरी बदल सकते हैं। लेबर मंत्रालय में शिकायत करें।'

    '-आप तब भी नौकरी बदल सकते हैं। छोड़ने से कम से कम 1 महीना पहले आवेदन करें।',
    '-<b>नया मालिक</b> (आप नहीं) पुराने मालिक को भर्ती के खर्च और हवाई टिकट का कुछ हिस्सा देता है। यह आपकी 2 महीने की बेसिक सैलरी से ज़्यादा नहीं होता।'

  {t:'फ़ीस और कितना समय लगता है', p:[

    '-1 साल या ज़्यादा काम किया? पुराने मालिक को आपका सर्विस खत्म होने का पैसा (ग्रेच्युटी) और बाकी छुट्टी का पैसा देना होगा।'

    '-अगर आपकी लेबर शिकायत या नौकरी बदलने का आवेदन पहले से चल रहा है, तो absconding रिपोर्ट उसके जाँचे और सुलझने के बाद ही हो सकती है।',

    '<b>मालिक रोक रहा है?</b> <a href="tel:16008">16008</a> पर कॉल करें, मंत्रालय के “Unified Platform for Complaints and Whistleblowers” पर शिकायत करें, <a href="mailto:info@mol.gov.qa">info@mol.gov.qa</a> पर ईमेल करें, या लेबर मंत्रालय के दफ़्तर जाएँ।',
    '<b>आवेदन से पहले ही क़तर ID रद्द हो गई?</b> पहले मंत्रालय में शिकायत करें। फिर Labour Relations Department के प्रमुख (Head) के नाम अरबी में साइन किया हुआ पत्र दें, जिसमें ID फिर से चालू करने की माँग हो। साथ में क़तर ID की कॉपी, ID रद्द होने का SMS, और नई नौकरी का ऑफ़र लगाएँ। सबकी कॉपी रखें।',

  {t:'ज़रूरी बातें', p:[

TR.hi.pages.listen={title:'आपकी आवाज़: सरकार आपकी बात कैसे सुनती है', intro:'क़तर में मज़दूरों की बात सुनने के कई तरीके हैं: सवाल पूछने, समस्या बताने या सुझाव देने के लिए।', secs:[
  {t:'लेबर मंत्रालय हेल्पलाइन और ऑनलाइन प्लेटफ़ॉर्म', p:[
    '<b>हेल्पलाइन <a href="tel:16008">16008</a></b>, 24 घंटे खुली। आप <b>अपना नाम बताए बिना</b> भी समस्या बता सकते हैं।',
    'मंत्रालय का ऑनलाइन <b>“Unified Platform for Complaints and Whistleblowers”</b> (शिकायत और गलत काम की सूचना का प्लेटफ़ॉर्म) शिकायतें लेता है, और कानून तोड़ने वाली कंपनियों की सूचना भी।',
    'ज़्यादातर शिकायतें मालिक से बात करके सुलझ जाती हैं। जनवरी से सितंबर 2024 तक प्लेटफ़ॉर्म पर 22,158 शिकायतें आईं। लगभग 73% मंत्रालय में ही सुलझ गईं।',
    'जनवरी से मार्च 2026 में मंत्रालय ने मज़दूरों की 5,369 शिकायतें दर्ज कीं और उन्हीं 3 महीनों में 2,797 सुलझाईं। लोगों से 486 सूचनाएँ (रिपोर्ट) भी मिलीं।'
  ]},
  {t:'जॉइंट कमेटी (Joint Committee): मज़दूर और मैनेजर साथ में', p:[
    'जॉइंट कमेटी कंपनी का एक समूह है जिसमें <b>मज़दूरों के चुने हुए प्रतिनिधि</b> और मैनेजर मिलकर काम की समस्याओं पर बात करते हैं और उन्हें सुलझाते हैं।',
    'मंत्रालय और ILO ने 2019 से 2023 तक कंपनियों में 73 जॉइंट कमेटी शुरू करके आज़माईं।',
    '<b>नया कानून (Law No. 9 of 2026):</b> <b>100 या ज़्यादा मज़दूरों</b> वाली कंपनियों में जॉइंट कमेटी होना ज़रूरी है। पूरे नियम मंत्रालय के फ़ैसले में आएँगे। मंत्रालय से पक्का करें।',
    'अपने HR से पूछें कि क्या आपकी कंपनी में जॉइंट कमेटी है, और आपके प्रतिनिधि कौन हैं।'
  ]},
  {t:'Labour Dispute Settlement Committees (लेबर झगड़ा निपटारा कमेटी)', p:[
    'अगर शिकायत नहीं सुलझती, तो जज की अगुवाई वाली कमेटी फ़ैसला करती है। मज़दूर कोर्ट फ़ीस नहीं देते।',
    'Law No. 9 of 2026 के तहत ये कमेटियाँ ऑनलाइन (इलेक्ट्रॉनिक) सुनवाई भी कर सकती हैं।',
    'जनवरी से मार्च 2026 में इन कमेटियों ने 2,228 फ़ैसले दिए।'
  ]},
  {t:'Workers’ Support and Insurance Fund (मज़दूर सहायता और बीमा फ़ंड)', p:[
    'कमेटी के फ़ैसले के बाद भी मालिक पैसा न दे, तो यह फ़ंड मज़दूर का बकाया देता है। देखें <a href="#help/wsif">अभी मदद लें</a>।',
    'फ़ंड और मंत्रालय मज़दूरों की समस्याएँ सुनने के लिए प्रवासी समुदाय के नेताओं (कम्युनिटी लीडर) से भी मिलते हैं।'
  ]},
  {t:'National Human Rights Committee (NHRC, राष्ट्रीय मानवाधिकार समिति)', p:[
    'मज़दूरों की शिकायतें लेती है। हेल्पलाइन <a href="tel:8002222">8002222</a>।',
    'हर साल अंतरराष्ट्रीय मज़दूर दिवस (1 मई) के आसपास मज़दूरों के लिए जागरूकता अभियान चलाती है।',
    'घरेलू कामगारों के लिए वर्कशॉप करती है, जहाँ वे अफ़सरों से बात कर सकते हैं, जैसे लेबर मंत्रालय के अफ़सर।'
  ]},
  {t:'कम्युनिटी लीडर और फ़ोरम', p:[
    'मंत्रालय और फ़ंड प्रवासी समुदायों के नेताओं से मिलते हैं। ये नेता मज़दूरों की बात मंत्रालय तक पहुँचाते हैं।',
    'कम्युनिटी लीडरों को क़तर के लेबर कानून की ट्रेनिंग मिलती है (2024 में 4 सेशन, मंत्रालय और Migrant Forum Asia के समझौते के तहत)।',
    'अक्टूबर 2024 में दोहा में Community Leaders’ Forum हुआ, जहाँ 19 देशों के लगभग 300 समुदाय प्रतिनिधि मंत्रालय और फ़ंड से मिले, BWI (एक अंतरराष्ट्रीय यूनियन) के साथ।',
    'समुदाय के समूह मंत्रालय की मदद से अधिकारों पर सेशन भी करते हैं, जैसे अगस्त 2025 में लेबर मंत्रालय के ट्रेनिंग रूम में।'
  ]},
  {t:'ILO और यूनियन के साथी आपके सवाल आगे पहुँचाते हैं', p:[
    'ILO दफ़्तर, अंतरराष्ट्रीय ट्रेड यूनियनों के कम्युनिटी लायज़न ऑफ़िसर, और कम्युनिटी लीडर मज़दूरों के सवाल लेते हैं और उन्हें कार्रवाई के लिए <b>लेबर मंत्रालय को भेजते हैं</b>।',
    'ILO से संपर्क: देखें <a href="#ilo">ILO दफ़्तर</a>।'
  ]},
  {t:'वर्ल्ड कप की विरासत: Workers’ Welfare Forum (मज़दूर कल्याण फ़ोरम)', p:[
    'FIFA World Cup 2022 के प्रोजेक्ट में Supreme Committee for Delivery & Legacy के <b>Workers’ Welfare Standards</b> के तहत मज़दूरों के हर रहने की जगह (कैंप) पर एक Workers’ Welfare Forum ज़रूरी था।',

TR.hi.pages.campaigns={title:'अभियान और जागरूकता', intro:'लेबर मंत्रालय और उसके साथी मज़दूरों को उनके अधिकार बताने और उन्हें सुरक्षित रखने के लिए अभियान चलाते हैं।', secs:[
  {t:'गर्मी से बचाव अभियान 2026 (Heat Stress Prevention Campaign)', p:[
    '<b>1 जून से 15 सितंबर 2026</b> तक चला, मंत्रालय के Occupational Safety and Health (काम पर सुरक्षा और सेहत) विभाग की अगुवाई में।',
    'साथी: Ministry of Public Health (स्वास्थ्य मंत्रालय), Workers’ Support and Insurance Fund, Ministry of Education and Higher Education, Public Works Authority, Qatar Red Crescent, और डिलीवरी कंपनियाँ Snoonu, Talabat, Rafeeq और Keeta।',
    '-कई भाषाओं में जानकारी वाले पर्चे।',

    'मंत्रालय के अनुसार जाँच और जागरूकता पूरे साल चलती रहती है। देखें <a href="#rights/heat">गर्मी से सुरक्षा</a>।'
  ]},
  {t:'गर्मी के अभियान क्या सिखाते हैं', p:[
    '<b>गर्मी लगने (हीट स्ट्रेस) के लक्षण:</b> चक्कर, सिरदर्द, बहुत पसीना (या बिल्कुल पसीना न आना), थकान, बेहोशी।',
    '<b>क्या करें:</b> काम रोकें, छाँव में जाएँ, पानी पिएँ, और ज़रूरत हो तो डॉक्टर की मदद लें। इमरजेंसी: <a href="tel:999">999</a>।',
    '<b>बचाव:</b> बार-बार पानी पिएँ, छाँव में आराम करें, बाहर हल्के कपड़े और सिर ढकने का सामान पहनें।'
  ]},
  {t:'पहले के गर्मी अभियान', p:[

    '-<b>2024:</b> खास जाँच हुई; नियम तोड़ने पर 368 काम की जगहें बंद की गईं।',
    '-<b>2024:</b> BWI (एक अंतरराष्ट्रीय यूनियन) और मंत्रालय का मिला-जुला गर्मी अभियान 25 कंपनियों और समुदायों के 2,824 से ज़्यादा मज़दूरों तक पहुँचा।'
  ]},
  {t:'सुरक्षा जाँच और सेमिनार', p:[

    '-NHRC घरेलू कामगारों को उनके अधिकार और ज़िम्मेदारियों की किताब 11 भाषाओं में देती है (जून 2025)।',
    '-NHRC के 2025 के मज़दूर दिवस अभियान का नाम था <b>“Legal aid: your voice is heard, your rights are protected”</b> (कानूनी मदद: आपकी आवाज़ सुनी जाती है, आपके अधिकार सुरक्षित हैं), लेबर मंत्रालय, फ़ंड, ILO और IOM के साथ।',
    '-मंत्रालय ने नौकरी बदलने वाले प्लेटफ़ॉर्म की गाइड अरबी और अंग्रेज़ी में जारी की।'
  ]},
  {t:'अपने देश में Qatar Visa Centre (क़तर वीज़ा सेंटर)', p:[
    'यात्रा से पहले, अपने देश के क़तर वीज़ा सेंटर में आप <b>अपना असली कॉन्ट्रैक्ट पढ़कर साइन</b> कर सकते हैं, उंगलियों के निशान देते हैं और मेडिकल जाँच कराते हैं। वहाँ आपको अपने अधिकारों और क़तर की ज़िंदगी के बारे में जानकारी भी मिलती है।',
    'ये सेवाएँ <b>मज़दूरों के लिए मुफ़्त</b> हैं। पैसा मालिक देता है।',
    'अगर कॉन्ट्रैक्ट वैसा नहीं है जैसा वादा किया गया था, तो जाने से पहले आप फिर से सोच सकते हैं।',
    'सेंटर (जुलाई 2024): भारत (New Delhi, Mumbai, Kolkata, Lucknow, Hyderabad, Chennai, Kochi), पाकिस्तान (Islamabad, Karachi), बांग्लादेश (Dhaka, Sylhet), नेपाल (Kathmandu), फ़िलीपींस (Manila), श्रीलंका (Colombo)। केन्या, इंडोनेशिया और ट्यूनीशिया में सेंटर खोलने की योजना थी।'
  ]},
  {t:'मज़दूर दिवस और समुदाय के कार्यक्रम', p:[
    '-<b>1 मई 2025:</b> अंतरराष्ट्रीय मज़दूर दिवस पर NHRC का मज़दूरों के अधिकारों पर सेमिनार, लेबर मंत्रालय, फ़ंड, ILO और IOM के साथ।',
    '-<b>मई 2024:</b> मज़दूर दिवस पर मज़दूरों के लिए 3-2-1 Qatar Olympic and Sports Museum की सैर (ILO और फ़ंड)।',
    '-<b>नवंबर 2024:</b> 300 से ज़्यादा डिलीवरी राइडर और ड्राइवरों के लिए सड़क सुरक्षा कार्यक्रम, घाना दूतावास, फ़ंड, लेबर मंत्रालय, गृह मंत्रालय (Ministry of Interior) और ILO के साथ।'
  ]},
  {t:'सिर्फ़ सरकारी चैनल देखें', p:[

  ]}
]};

  help:{title:'এখনই সাহায্য', intro:'আপনার অভিযোগ করার অধিকার আছে। এভাবে করুন।', secs:[
    {t:'শ্রম অভিযোগ কীভাবে করবেন', steps:[

      ['মীমাংসার মিটিং','মন্ত্রণালয় আপনাকে ও মালিককে ডেকে কথা বলে সমস্যা মেটানোর চেষ্টা করে। প্রমাণ সাথে আনুন।'],
      ['Labour Dispute Settlement Committee (শ্রম বিরোধ নিষ্পত্তি কমিটি)','মীমাংসা না হলে মামলা এই কমিটিতে যেতে পারে। এর নেতৃত্বে একজন বিচারক থাকেন। শ্রমিকদের কোর্ট ফি দিতে হয় না। শুনানি হয় আরবিতে। প্রথম শুনানি থেকে ৩ সপ্তাহের মধ্যে কমিটির সিদ্ধান্ত দেওয়ার কথা। যেকোনো পক্ষ Court of Appeal (আপিল আদালত)-এ আপিল করতে পারে।'],
      ['তবুও টাকা পাননি?','কমিটি টাকা দেওয়ার আদেশ দিলেও মালিক না দিলে <a href="#help/wsif">Workers’ Support and Insurance Fund</a>-এ আবেদন করুন।']

      '<b>চাকরিচ্যুত বা শাস্তি পেয়েছেন?</b> ৭ দিনের মধ্যে মালিককে লিখিত অভিযোগ দিন। মালিকের উত্তর দেওয়ার সময় ৭ দিন। সন্তুষ্ট না হলে পরের ৭ দিনের মধ্যে মন্ত্রণালয়ে যান।',

      '-শুধু মন্ত্রণালয়ের সরকারি ওয়েবসাইট <b>mol.gov.qa</b> ও সরকারি সোশ্যাল মিডিয়া <b>@MOLQTR</b> বিশ্বাস করুন। ভুয়া অ্যাকাউন্ট আছে।',
      '-পাসওয়ার্ড, পিন কোড বা ব্যাংকের তথ্য কাউকে দেবেন না।'

  salary:{title:'বেতন দেরিতে? কী করবেন', intro:'এই ধাপগুলো মেনে চলুন। শান্ত থাকুন, প্রমাণ রাখুন।', steps:[
    ['তারিখ দেখুন','মাসিক বেতন মাসের <b>১ তারিখে</b> পাওনা। মালিককে WPS-এর মাধ্যমে <b>৭ দিনের</b> মধ্যে ব্যাংকে দিতে হবে। (গৃহকর্মী: পরের মাসের <b>৩ তারিখের</b> মধ্যে।)'],
    ['প্রমাণ রাখুন','চুক্তি, কাতার আইডি, ব্যাংক স্টেটমেন্ট বা SMS, পে-স্লিপ ও মেসেজ রাখুন। তারিখ লিখে রাখুন। ছবি তুলুন।'],
    ['ভদ্রভাবে মালিককে বলুন','HR বা ম্যানেজারকে জিজ্ঞেস করুন, সম্ভব হলে লিখে (মেসেজ বা চিঠি)। যা পাঠালেন আর যা উত্তর পেলেন, তার কপি রাখুন।'],
    ['শ্রম মন্ত্রণালয়ে অভিযোগ করুন','কল করুন <a href="tel:16008">16008</a> বা <a href="https://www.mol.gov.qa" target="_blank" rel="noopener">mol.gov.qa</a>-তে অনলাইন অভিযোগ প্ল্যাটফর্ম ব্যবহার করুন। কেউই বেতন না পেলে অনেকে মিলে একসাথে অভিযোগ করা যায়।'],
    ['মিটিংয়ে যান','মন্ত্রণালয় মালিকের সাথে মীমাংসার চেষ্টা করবে। প্রমাণ ও পাওনার তালিকা নিয়ে যান।'],
    ['কমিটি (বিচারক)','মীমাংসা না হলে মামলা Labour Dispute Settlement Committee-তে যেতে পারে। শ্রমিকদের কোর্ট ফি লাগে না। শুনানি আরবিতে, তাই ভাষার সাহায্য চান (দূতাবাস পরামর্শ দিতে পারে)।'],
    ['Workers’ Support and Insurance Fund','কমিটি টাকা দেওয়ার আদেশ দিলেও মালিক না দিলে, সিদ্ধান্তের কপি নিয়ে তহবিলে আবেদন করুন।'],
    ['চাকরি বদলের কথা জিজ্ঞেস করুন','২০২৬ সালের আইনে বেতনের নিয়ম ভাঙার শিকার শ্রমিক মালিক বদলানো বা চুক্তি শেষ করার আবেদন করতে পারেন, আর দেশে ফেরার খরচ মালিক দেবে। মন্ত্রণালয়ে জিজ্ঞেস করুন।'],
    ['দূতাবাসকে জানান','আপনার দূতাবাসের শ্রম বিভাগ পরামর্শ দিতে পারে। দেখুন <a href="#embassies">দূতাবাস</a>।']
  ], p:['<span class="note">যে টাকা পাননি, তা পেয়েছেন বলে কোনো কাগজে সই করবেন না। কাজে থাকা অবস্থায় বা চাকরি শেষের ১ বছরের মধ্যে অভিযোগ করুন।</span>']},

  mol:{title:'শ্রম মন্ত্রণালয় (Ministry of Labour)', intro:'শ্রম মন্ত্রণালয় (MoL) কাজ ও শ্রমিকদের জন্য কাতার সরকারের দপ্তর।', secs:[

      '-অনলাইন প্ল্যাটফর্মে <b>চাকরি বদলের</b> আবেদন ও নোটিশ দেখে।',
      '-কাজের জায়গা পরিদর্শন করে, <b>গ্রীষ্মের গরমের নিয়ম</b>সহ। নিয়ম ভাঙলে কাজের জায়গা বন্ধ করতে পারে।',

    {t:'মন্ত্রণালয়ে কীভাবে যোগাযোগ করবেন', p:[
      '<b>হটলাইন 16008</b> – অভিযোগ ও প্রশ্নের জন্য। ২৪ ঘণ্টা খোলা। নাম না বলেও নিয়ম ভাঙার খবর দিতে পারেন।',

    {t:'WhatsApp তথ্য সেবা', p:[

  ilo:{title:'কাতারে ILO অফিস', intro:'International Labour Organization (ILO, আন্তর্জাতিক শ্রম সংস্থা) কাজ নিয়ে জাতিসংঘের সংস্থা। কাতার ১৯৭২ সাল থেকে এর সদস্য।', secs:[
    {t:'ILO অফিস কী করে', p:[

      'এই কর্মসূচি সর্বনিম্ন বেতন, গরমের নিয়ম, বেতন সুরক্ষা, এবং NOC ও এক্সিট পারমিটের নিয়ম বাতিলের মতো সংস্কারে সহায়তা করেছে।',
      'ILO অফিস ও তার সহযোগীরা <b>শ্রমিকদের প্রশ্ন নেয় এবং ব্যবস্থা নেওয়ার জন্য শ্রম মন্ত্রণালয়ে পাঠায়</b>। বেশিরভাগ প্রশ্ন না-পাওয়া বেতন, চাকরি শেষের টাকা ও মালিক বদল নিয়ে।',

  emergency:{title:'জরুরি অবস্থা', intro:'বিপদে আছেন, আঘাত পেয়েছেন, বা আগুন বা দুর্ঘটনা দেখেছেন? 999-এ কল করুন। পুলিশ, অ্যাম্বুলেন্স ও আগুনের জন্য ২৪ ঘণ্টা চালু।', secs:[
    {t:'999-এ কল করলে', p:[
      '-পরিষ্কার করে বলুন।',
      '-আপনার নাম ও ফোন নম্বর বলুন।',

  sources:{title:'তথ্যসূত্র (সোর্স)', intro:'এই অ্যাপের প্রতিটি তথ্য এসব সরকারি বা নির্ভরযোগ্য সূত্র থেকে নেওয়া।', p:[
    'শেষ যাচাই: <b>সেপ্টেম্বর ২০২৬</b>।',
    'আইন: Labour Law No. 14 of 2004 ও তার সংশোধনী (Law No. 18 of 2020 ও Law No. 9 of 2026 সহ); Law No. 15 of 2017 (গৃহকর্মী); Law No. 17 of 2020 (সর্বনিম্ন বেতন); Law No. 19 of 2020; Law No. 21 of 2015 (প্রবেশ, প্রস্থান, বসবাস); Ministerial Decision No. 17 of 2021 (হিট স্ট্রেস); Law No. 17 of 2018 (Workers’ Support and Insurance Fund)।',
    '<span class="note">নোট: যাচাইয়ের সময় শ্রম মন্ত্রণালয় ও Workers’ Support and Insurance Fund-এর ওয়েবসাইট খোলা যায়নি। তাদের তথ্য নেওয়া হয়েছে ILO-র কাগজপত্র, মন্ত্রণালয়ের চিঠি, এবং মন্ত্রণালয় বা সরকারি গেজেট উদ্ধৃত করা খবর থেকে।</span>'
  ]},

  about:{title:'অ্যাপ সম্পর্কে ও জরুরি কথা', p:[
    '<b>Worker Info</b> কাতারের প্রবাসী শ্রমিকদের জন্য একটি বিনামূল্যের, সহজ গাইড: সিকিউরিটি গার্ড, নির্মাণ শ্রমিক, গৃহকর্মী, ড্রাইভার, ক্লিনার ও সবার জন্য।',
    'তৈরি করেছেন: <b>Nimrod</b>।',
    '<span class="note"><b>জরুরি কথা:</b> এটি সাধারণ তথ্য, আইনি পরামর্শ নয়। আইন, নিয়ম ও ফোন নম্বর বদলাতে পারে। সবসময় শ্রম মন্ত্রণালয় (16008) বা mol.gov.qa থেকে নিশ্চিত হন। এই অ্যাপ কাতার সরকার, ILO বা কোনো দূতাবাস তৈরি করেনি।</span>',
    'এই অ্যাপ ইন্টারনেট ছাড়াই চলে। এটি আপনার কোনো তথ্য নেয় না, কোনো ট্র্যাকিংও নেই।',
    'এই বাংলা অনুবাদ মেশিনের সাহায্যে করা হয়েছে। মূল (রেফারেন্স) হলো ইংরেজি সংস্করণ। কিছু পরিষ্কার না হলে ইংরেজিতে দেখুন।',
    'শেষ যাচাই: সেপ্টেম্বর ২০২৬।'
  ]}
  }
};

TR.bn.pages.change={title:'চাকরি বদল', intro:'আপনি কাতারে চাকরি বদলাতে পারেন। এর জন্য মালিকের অনুমতি (NOC) <b>লাগে না</b>। এভাবে করুন।', secs:[
  {t:'কে চাকরি বদলাতে পারে?', p:[
    'প্রত্যেক শ্রমিক চুক্তির মধ্যে যেকোনো সময় চাকরি বদলাতে পারেন, <b>NOC (No Objection Certificate) ছাড়াই</b>।',
    'এর মধ্যে প্রাইভেট কোম্পানির শ্রমিক, গৃহকর্মী, আর কৃষি ও মাছ ধরার শ্রমিকরাও আছেন।',
    '-আপনার কাতার আইডি (রেসিডেন্স পারমিট) চালু থাকতে হবে, বা শেষ হওয়ার পর <b>৯০ দিনের</b> কম হতে হবে।',
    '-আপনার <b>নিজের নামে</b> কাতারের মোবাইল নম্বর লাগবে, যা আপনার কাতার আইডির সাথে যুক্ত।'
  ]},
  {t:'ধাপে ধাপে', steps:[
    ['নতুন চাকরি খুঁজুন','চাকরির পরিষ্কার অফার নিন। বেতন, পদ, চুক্তির মেয়াদ, প্রবেশন, খাবার ও থাকার জায়গা – সব দেখে নিন।'],
    ['আবেদন হয় অনলাইনে','আবেদন শুধু শ্রম মন্ত্রণালয়ের ওয়েবসাইট <a href="https://www.mol.gov.qa" target="_blank" rel="noopener">mol.gov.qa</a>-তে হয়, সেবার নাম “Change of employer within the labour market”। সাধারণত নতুন মালিক আবেদন শুরু করে এবং নতুন চুক্তির তথ্য দেয়। আপনি নিজেও শুরু করতে পারেন।'],
    ['৩ দিনের মধ্যে দেখে রাজি হোন','আপনার কাছে SMS আসবে। “Labors and Individuals” পোর্টালে লগ-ইন করুন, “My Requests” খুলুন, আবেদনটি বাছুন, “Take Action” চাপুন, সব তথ্য দেখুন, তারপর “Approve” চাপুন। আপনার হাতে <b>৩ দিন</b>। কিছু না করলে আবেদন নিজে থেকেই বাতিল হয়ে যাবে।'],
    ['মালিককে জানানো হয়','আপনার বর্তমান মালিকের কাছে মেসেজ যায়। তিনি মন্ত্রণালয়ের জন্য মন্তব্য লিখতে পারেন, কিন্তু তার রাজি হওয়া জরুরি <b>নয়</b>।'],
    ['মন্ত্রণালয় অনুমোদন দেয়','আপনার কাছে SMS আসবে, যাতে নোটিশের শেষ দিন লেখা থাকবে। আবেদন নম্বর ও SMS রেখে দিন।'],
    ['নোটিশের সময় পূরণ করুন','নোটিশ শেষ না হওয়া পর্যন্ত বর্তমান মালিকের কাছে কাজ চালিয়ে যান, যদি না মালিক নোটিশ কমাতে রাজি হন।'],
    ['নতুন চুক্তি ও নতুন কাতার আইডি','নোটিশ শেষ হওয়ার ৩ মাসের মধ্যে নতুন মালিক আপনার নতুন চুক্তি মন্ত্রণালয়ে নিবন্ধন করে এবং নতুন কাতার আইডির আবেদন করে। তাকে আপনাকে চুক্তির কপি ও নতুন আইডি দিতে হবে।']
  ]},
  {t:'নোটিশের সময়', p:[
    '-এই মালিকের কাছে <b>২ বছর বা কম</b> কাজ করেছেন: <b>১ মাসের</b> নোটিশ।',
    '-<b>২ বছরের বেশি</b> কাজ করেছেন: <b>২ মাসের</b> নোটিশ।',
    '-<b>প্রবেশন</b> চলাকালে: চলে যাওয়ার অন্তত <b>১ মাস</b> আগে আবেদন করুন।',
    'মালিক নোটিশ কমাতে বা বাদ দিতে রাজি হতে পারেন। দুজনেই রাজি হলে আবেদনে এর জন্য “Yes” বাছুন। লিখিতভাবেও নিয়ে রাখুন।',
    'নোটিশ শেষের আগে চলে যেতে চান? যত দিন কাজ করবেন না, তত দিনের মূল বেতন মালিককে দিতে হবে। উদাহরণ: মূল বেতন মাসে QAR 1,500, ২ সপ্তাহ আগে চলে গেলেন = আপনি QAR 750 দেবেন।',
    '<b>বেতন পাননি?</b> মালিক আইন না মানলে (যেমন বেতন না দিলে), আপনি নোটিশ ছাড়াই চাকরি বদলাতে পারেন। শ্রম মন্ত্রণালয়ে অভিযোগ করুন।'
  ]},
  {t:'প্রবেশনের সময়', p:[
    '-প্রবেশন সর্বোচ্চ <b>৬ মাস</b> (গৃহকর্মী: সর্বোচ্চ <b>৩ মাস</b>)। একই মালিকের কাছে একবারই প্রবেশন।',
    '-তখনও চাকরি বদলাতে পারেন। চলে যাওয়ার অন্তত ১ মাস আগে আবেদন করুন।',
    '-<b>নতুন মালিক</b> (আপনি নন) পুরোনো মালিককে নিয়োগ খরচ ও বিমান টিকিটের কিছু অংশ দেয়। এটা আপনার ২ মাসের মূল বেতনের বেশি নয়।'
  ]},
  {t:'ফি ও কত সময় লাগে', p:[
    '-মালিক বদল শ্রমিকদের জন্য <b>বিনামূল্যে</b>।',
    '-নতুন কাতার আইডির জন্য নতুন মালিককে কোনো টাকা দিতে হয় না।',
    '-নির্দিষ্ট কোনো সময় প্রকাশ করা হয়নি। ILO জানিয়েছে, সেপ্টেম্বর ২০২৪-এ একটি আবেদন শেষ করতে মন্ত্রণালয়ের গড়ে <b>৯ দিন</b> লেগেছে। মন্ত্রণালয়ে জেনে নিন।',
    '-১ বছর বা বেশি কাজ করেছেন? পুরোনো মালিককে আপনার চাকরি শেষের টাকা (গ্র্যাচুইটি) ও বাকি ছুটির টাকা দিতে হবে।'
  ]},
  {t:'মালিক রাজি না হলে, বা “পালিয়ে গেছে” (absconding) মামলা করলে', p:[
    '-মালিকের রাজি হওয়া জরুরি <b>নয়</b>। NOC লাগে না।',
    '-চাকরি বদলের আবেদন দেওয়ার পর মালিক <b>আপনার কাতার আইডি বাতিল করতে পারবে না</b>, আর “পালিয়ে গেছে” (absconding)-এর মিথ্যা মামলা করতে পারবে না।',
    '-আপনার শ্রম অভিযোগ বা চাকরি বদলের আবেদন আগে থেকে চললে, সেটা দেখা ও মীমাংসা হওয়ার পরেই শুধু absconding রিপোর্ট করা যায়।',
    '-ইচ্ছা করে মিথ্যা absconding রিপোর্ট করলে শাস্তি হতে পারে।',
    '<b>মালিক আটকাচ্ছে?</b> কল করুন <a href="tel:16008">16008</a>, মন্ত্রণালয়ের “Unified Platform for Complaints and Whistleblowers”-এ অভিযোগ করুন, ইমেইল করুন <a href="mailto:info@mol.gov.qa">info@mol.gov.qa</a>, বা শ্রম মন্ত্রণালয়ের অফিসে যান।',
    '<b>আবেদনের আগেই কাতার আইডি বাতিল হয়ে গেছে?</b> আগে মন্ত্রণালয়ে অভিযোগ করুন। তারপর Labour Relations Department-এর প্রধান (Head)-এর নামে আরবিতে সই করা চিঠি দিন, আইডি আবার চালু করার অনুরোধ করে। সাথে দিন কাতার আইডির কপি, আইডি বাতিলের SMS, ও নতুন চাকরির অফার। সবকিছুর কপি রাখুন।',
    'আপনার দূতাবাসকেও জানান। দেখুন <a href="#embassies">দূতাবাস</a>।'
  ]},
  {t:'জেনে রাখুন', p:[
    '-নোটিশ না দিয়ে কাতার ছাড়বেন না। তাহলে ১ বছর কাতারে কাজে ফিরতে না-ও পারেন।',
    '-আবেদন যাচাই চলাকালে আপনি তা বাতিল করতে পারেন।',
    '-শুধু সরকারি ওয়েবসাইট <b>mol.gov.qa</b> ব্যবহার করুন। চাকরি বদলের জন্য মন্ত্রণালয় শ্রমিকদের কাছ থেকে টাকা নেয় না।',
    '-গৃহকর্মীদের জন্যও একই নিয়ম (প্রবেশন ৩ মাস পর্যন্ত)।'
  ]}
]};

TR.bn.pages.listen={title:'আপনার কথা: সরকার কীভাবে শোনে', intro:'কাতারে শ্রমিকদের কথা শোনার অনেক উপায় আছে: প্রশ্ন করতে, সমস্যা জানাতে বা পরামর্শ দিতে।', secs:[
  {t:'শ্রম মন্ত্রণালয়ের হটলাইন ও অনলাইন প্ল্যাটফর্ম', p:[
    '<b>হটলাইন <a href="tel:16008">16008</a></b>, ২৪ ঘণ্টা খোলা। <b>নাম না বলেও</b> সমস্যা জানাতে পারেন।',
    'মন্ত্রণালয়ের অনলাইন <b>“Unified Platform for Complaints and Whistleblowers”</b> (অভিযোগ ও অনিয়মের খবর দেওয়ার প্ল্যাটফর্ম) অভিযোগ নেয়, আর আইন ভাঙা কোম্পানির খবরও নেয়।',
    'বেশিরভাগ অভিযোগ মালিকের সাথে কথা বলেই মিটে যায়। জানুয়ারি থেকে সেপ্টেম্বর ২০২৪-এ প্ল্যাটফর্মে ২২,১৫৮টি অভিযোগ আসে। প্রায় ৭৩% মন্ত্রণালয়েই মীমাংসা হয়।',

  ]},
  {t:'জয়েন্ট কমিটি (Joint Committee): শ্রমিক ও ম্যানেজার একসাথে', p:[
    'জয়েন্ট কমিটি হলো কোম্পানির একটি দল, যেখানে <b>শ্রমিকদের বেছে নেওয়া প্রতিনিধি</b> ও ম্যানেজাররা মিলে কাজের সমস্যা নিয়ে কথা বলেন এবং সমাধান করেন।',
    'মন্ত্রণালয় ও ILO ২০১৯ থেকে ২০২৩ পর্যন্ত বিভিন্ন কোম্পানিতে ৭৩টি পরীক্ষামূলক জয়েন্ট কমিটি চালু করেছিল।',
    '<b>নতুন আইন (Law No. 9 of 2026):</b> <b>১০০ বা বেশি শ্রমিক</b> আছে এমন কোম্পানিতে জয়েন্ট কমিটি থাকতেই হবে। বিস্তারিত নিয়ম আসবে মন্ত্রণালয়ের সিদ্ধান্তে। মন্ত্রণালয়ে জেনে নিন।',
    'আপনার HR-কে জিজ্ঞেস করুন কোম্পানিতে জয়েন্ট কমিটি আছে কি না, আর আপনার শ্রমিক প্রতিনিধি কারা।'

  {t:'Labour Dispute Settlement Committees (শ্রম বিরোধ নিষ্পত্তি কমিটি)', p:[

    'জানুয়ারি থেকে মার্চ ২০২৬-এ কমিটিগুলো ২,২২৮টি সিদ্ধান্ত দিয়েছে।'

  {t:'Workers’ Support and Insurance Fund (শ্রমিক সহায়তা ও বীমা তহবিল)', p:[

  {t:'National Human Rights Committee (NHRC, জাতীয় মানবাধিকার কমিটি)', p:[

    'প্রতি বছর আন্তর্জাতিক শ্রমিক দিবস (১ মে)-এর সময় শ্রমিকদের জন্য সচেতনতা প্রচারণা চালায়।',

  ]},
  {t:'কমিউনিটি নেতা ও ফোরাম', p:[

    'অক্টোবর ২০২৪-এ দোহায় Community Leaders’ Forum-এ ১৯টি দেশের প্রায় ৩০০ কমিউনিটি প্রতিনিধি মন্ত্রণালয় ও তহবিলের সাথে দেখা করেন, BWI (একটি আন্তর্জাতিক ইউনিয়ন)-এর সাথে।',
    'কমিউনিটির দলগুলো মন্ত্রণালয়ের সহায়তায় অধিকার নিয়ে সেশনও করে, যেমন আগস্ট ২০২৫-এ শ্রম মন্ত্রণালয়ের ট্রেনিং রুমে।'
  ]},
  {t:'ILO ও ইউনিয়নের সহকর্মীরা আপনার প্রশ্ন পৌঁছে দেয়', p:[
    'ILO অফিস, আন্তর্জাতিক ট্রেড ইউনিয়নের কমিউনিটি লিয়াজোঁ অফিসার, ও কমিউনিটি নেতারা শ্রমিকদের প্রশ্ন নেন এবং ব্যবস্থা নেওয়ার জন্য <b>শ্রম মন্ত্রণালয়ে পাঠান</b>।',
    'ILO-তে যোগাযোগ: দেখুন <a href="#ilo">ILO অফিস</a>।'

  {t:'বিশ্বকাপের উত্তরাধিকার: Workers’ Welfare Forum (শ্রমিক কল্যাণ ফোরাম)', p:[
    'FIFA World Cup 2022-এর প্রকল্পে Supreme Committee for Delivery & Legacy-র <b>Workers’ Welfare Standards</b> অনুযায়ী শ্রমিকদের প্রতিটি থাকার জায়গায় (ক্যাম্পে) একটি Workers’ Welfare Forum থাকতে হতো।',
    'শ্রমিকরা নিজেদের প্রতিনিধি বেছে নিতেন (প্রতি দেশ থেকে একজন)। ফোরাম মাসে অন্তত একবার বসত, আর শ্রমিকরা শাস্তির ভয় ছাড়াই নিজের কথা বলতে পারতেন।'
  ]}

TR.bn.pages.campaigns={title:'প্রচারণা ও সচেতনতা', intro:'শ্রম মন্ত্রণালয় ও তার সহযোগীরা শ্রমিকদের অধিকার জানাতে ও নিরাপদ রাখতে প্রচারণা চালায়।', secs:[
  {t:'গরম থেকে সুরক্ষার প্রচারণা ২০২৬ (Heat Stress Prevention Campaign)', p:[
    '<b>১ জুন থেকে ১৫ সেপ্টেম্বর ২০২৬</b> পর্যন্ত চলেছে, মন্ত্রণালয়ের Occupational Safety and Health (কাজের নিরাপত্তা ও স্বাস্থ্য) বিভাগের নেতৃত্বে।',
    'সহযোগী: Ministry of Public Health (স্বাস্থ্য মন্ত্রণালয়), Workers’ Support and Insurance Fund, Ministry of Education and Higher Education, Public Works Authority, Qatar Red Crescent, এবং ডেলিভারি কোম্পানি Snoonu, Talabat, Rafeeq ও Keeta।',
    '-বিভিন্ন ভাষায় নির্দেশনা ও তথ্যপত্র।',
